<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>ONE BOAT｜ボートレースデータ分析</title>
<meta name="description" content="ONE BOAT｜データで選ぶ。買わないレースも選ぶ。" />
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}body{min-height:100vh;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.oneboat-top{position:relative;width:min(100%,432px);margin:0 auto;background:#fff;line-height:0}.oneboat-top>img{display:block;width:100%;height:auto;margin:0;padding:0;border:0;image-rendering:auto;user-select:none;-webkit-user-drag:none}.tap{position:absolute;display:block;z-index:3;background:transparent;border:0;padding:0;margin:0;-webkit-tap-highlight-color:transparent}.tap-club{left:69.5%;top:2.15%;width:17.5%;height:4.8%}.tap-menu{left:89.5%;top:2.35%;width:7.6%;height:4.5%}.tap-today{left:4.8%;top:69.4%;width:90.4%;height:6.0%}.tap-results{left:4.8%;top:75.9%;width:90.4%;height:5.8%}.menu-panel{display:none;position:absolute;right:4%;top:7%;z-index:6;width:190px;background:rgba(255,255,255,.98);border:1px solid #d9ebf6;border-radius:15px;box-shadow:0 14px 36px rgba(4,47,84,.18);padding:7px;line-height:1.3}.menu-panel.open{display:block}.menu-panel a{display:block;color:#123f66;text-decoration:none;font-size:13px;font-weight:800;padding:12px 11px;border-radius:10px}.menu-panel a:active{background:#eef8ff}@media(min-width:433px){body{background:#fff}}
</style>
</head>
<body>
<main class="oneboat-top" aria-label="ONE BOAT トップ">
  <img src="/top-screen.webp?v=20260917-static3" alt="ONE BOAT｜データで選ぶ。買わないレースも選ぶ。" width="864" height="1536" fetchpriority="high" decoding="async" />
  <a class="tap tap-club" href="#" aria-label="ONE BOAT CLUB"></a>
  <button class="tap tap-menu" id="menuButton" type="button" aria-label="メニュー" aria-expanded="false"></button>
  <a class="tap tap-today" href="/today.html" aria-label="本日の予想を見る"></a>
  <a class="tap tap-results" href="/today.html#performance" aria-label="実績を見る"></a>
  <nav class="menu-panel" id="menuPanel" aria-label="メインメニュー">
    <a href="/">HOME</a><a href="/today.html">本日の予想</a><a href="/today.html#performance">実績</a><a href="#" aria-disabled="true">ONE BOAT CLUB</a>
  </nav>
</main>
<script>const b=document.getElementById('menuButton'),p=document.getElementById('menuPanel');b.addEventListener('click',()=>{const o=p.classList.toggle('open');b.setAttribute('aria-expanded',String(o))});document.addEventListener('click',e=>{if(!p.contains(e.target)&&e.target!==b){p.classList.remove('open');b.setAttribute('aria-expanded','false')}});</script>
</body>
</html>
