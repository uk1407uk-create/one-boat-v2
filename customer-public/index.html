<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>ONE BOAT｜ボートレースデータ分析</title>
<meta name="description" content="ONE BOAT｜データで選ぶ。買わないレースも選ぶ。" />
<style>
:root{
  --navy:#082f59;
  --navy2:#0b4a78;
  --blue:#0b86de;
  --cyan:#1db9ea;
  --ice:#eef9ff;
  --line:#d7eaf5;
  --muted:#5d7690;
  --shadow:0 14px 34px rgba(29,91,132,.10);
}
*{box-sizing:border-box}
html{background:#fff;scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--navy);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 84% 64%,rgba(81,197,242,.12),transparent 30%),
    linear-gradient(180deg,#fff 0%,#fff 70%,#eefaff 100%);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit}
.shell{width:min(100%,432px);margin:0 auto;position:relative;background:transparent;min-height:100vh}
.header{
  height:68px;
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:14px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 20px 0;
  position:relative;
  z-index:30;
}
.logo{
  display:flex;align-items:center;gap:1px;
  text-decoration:none;
  color:#082f59;
  font-weight:800;
  font-size:22px;
  line-height:1;
  letter-spacing:.045em;
  white-space:nowrap;
}
.logo .accent{color:#13a9df;font-weight:700}
.club-link{
  min-width:66px;height:36px;
  border:1.5px solid #8dccef;
  border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;
  font-size:11px;font-weight:900;letter-spacing:.22em;
  color:#0b4f80;
  background:rgba(255,255,255,.78);
  box-shadow:0 2px 10px rgba(16,112,172,.05);
}
.menu-button{
  width:38px;height:38px;border:0;background:transparent;padding:8px 4px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
}
.menu-button span{display:block;width:25px;height:3px;border-radius:99px;background:#082f59;margin-left:auto}
.menu-panel{
  display:none;position:absolute;right:16px;top:64px;z-index:40;width:205px;
  background:rgba(255,255,255,.98);border:1px solid #d8eaf5;border-radius:17px;
  box-shadow:0 18px 42px rgba(4,47,84,.18);padding:7px;
  backdrop-filter:blur(14px);
}
.menu-panel.open{display:block}
.menu-panel a{display:block;text-decoration:none;color:#123f66;font-size:13px;font-weight:850;padding:12px;border-radius:11px}
.menu-panel a:active{background:#eef8ff}
.hero-wrap{padding:10px 18px 0}
.hero{
  position:relative;overflow:hidden;border-radius:25px;
  background:linear-gradient(135deg,#178be0,#65c8ee);
  box-shadow:0 18px 34px rgba(16,126,194,.16);
  aspect-ratio:430/328;
}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
.intro{text-align:center;padding:24px 22px 0}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:.30em;color:#29a9d9;margin-bottom:10px}
.intro h1{margin:0;font-size:31px;line-height:1.30;letter-spacing:-.045em;font-weight:900;color:#082f59}
.intro h1 .blue{display:block;color:#0f98d8}
.intro p{margin:14px auto 0;max-width:355px;font-size:13px;line-height:1.75;color:#55708b;font-weight:600}
.actions{padding:18px 20px 0;display:grid;gap:10px}
.cta{
  height:58px;border-radius:14px;text-decoration:none;
  display:grid;grid-template-columns:1fr 22px;align-items:center;
  padding:0 18px 0 40px;
  font-size:16px;font-weight:900;letter-spacing:.01em;
  box-shadow:0 8px 18px rgba(29,104,163,.08);
  -webkit-tap-highlight-color:transparent;
}
.cta.primary{color:#fff;background:linear-gradient(90deg,#17addf 0%,#0a7be4 100%)}
.cta.secondary{color:#0b72bb;background:#fff;border:1.5px solid #9fcfec}
.cta .arrow{font-size:30px;font-weight:300;line-height:1;text-align:right;transform:translateY(-1px)}
.feature-grid{padding:18px 20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feature-card{
  min-width:0;height:96px;background:rgba(255,255,255,.95);border:1px solid rgba(220,237,247,.92);
  border-radius:15px;box-shadow:var(--shadow);padding:13px 8px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.feature-icon{height:28px;display:flex;align-items:center;justify-content:center;margin-bottom:5px;color:#0b89d1}
.doc-icon{width:22px;height:25px;border-radius:3px;background:linear-gradient(180deg,#61c9f0,#108ee1);position:relative;box-shadow:0 3px 7px rgba(15,127,199,.18)}
.doc-icon:before,.doc-icon:after{content:"";position:absolute;left:5px;right:5px;height:2px;background:#fff;border-radius:2px}.doc-icon:before{top:9px}.doc-icon:after{top:14px}
.bars-icon{width:29px;height:27px;display:flex;align-items:flex-end;gap:3px}.bars-icon i{display:block;width:7px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#0a96df,#086fcb)}.bars-icon i:nth-child(1){height:10px}.bars-icon i:nth-child(2){height:19px}.bars-icon i:nth-child(3){height:27px}
.skip-icon{width:26px;height:26px;border:3px solid #0b72ba;border-radius:50%;position:relative}.skip-icon:after{content:"";position:absolute;left:5px;right:5px;top:9px;height:3px;border-radius:9px;background:#0b72ba}
.feature-card strong{font-size:13px;line-height:1.1;color:#0a355e;white-space:nowrap}
.feature-card small{font-size:8.5px;line-height:1.35;color:#6f879b;font-weight:700;margin-top:6px;white-space:nowrap}
.tagline{padding:29px 20px 18px;text-align:center;display:flex;align-items:center;gap:8px;justify-content:center;color:#2a9bc9;font-size:8px;font-weight:900;letter-spacing:.22em;white-space:nowrap}
.tagline:before,.tagline:after{content:"";height:1px;width:28px;background:#71cae7;opacity:.8}
.wave{height:76px;position:relative;overflow:hidden;margin-top:-2px}
.wave:before,.wave:after{content:"";position:absolute;left:-8%;width:116%;border-radius:50% 50% 0 0 / 100% 100% 0 0}
.wave:before{height:52px;bottom:-17px;background:rgba(74,191,235,.25);transform:rotate(-2deg)}
.wave:after{height:40px;bottom:-18px;background:rgba(30,169,226,.18);transform:rotate(2deg)}
@media (min-width:433px){body{padding-bottom:30px}.shell{box-shadow:0 0 45px rgba(14,70,108,.07)}}
@media (max-width:380px){.header{padding-left:15px;padding-right:14px;gap:10px}.logo{font-size:20px}.hero-wrap{padding-left:14px;padding-right:14px}.intro{padding-left:16px;padding-right:16px}.intro h1{font-size:28px}.actions,.feature-grid{padding-left:14px;padding-right:14px}.feature-card strong{font-size:12px}.feature-card small{font-size:8px}}
@media (prefers-reduced-motion:no-preference){.cta:active,.feature-card:active{transform:scale(.99)}}
</style>
</head>
<body>
<main class="shell" aria-label="ONE BOAT お客様サイト">
  <header class="header">
    <a class="logo" href="/" aria-label="ONE BOAT トップ">ONE BO<span class="accent">A</span>T</a>
    <a class="club-link" href="/today.html#club">CLUB</a>
    <button class="menu-button" id="menuButton" type="button" aria-label="メニュー" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="menu-panel" id="menuPanel" aria-label="メインメニュー">
      <a href="/">HOME</a>
      <a href="/today.html">本日の予想</a>
      <a href="/today.html#performance">実績</a>
      <a href="/today.html#club">ONE BOAT CLUB</a>
    </nav>
  </header>

  <section class="hero-wrap" aria-label="ONE BOAT メインビジュアル">
    <div class="hero"><img src="/assets/customer-hero.webp?v=20260918-selected2" alt="データが勝負を変えていく。ONE BOAT BOAT RACE ANALYTICS" width="430" height="328" fetchpriority="high" decoding="async" /></div>
  </section>

  <section class="intro">
    <div class="eyebrow">BOAT RACE ANALYTICS</div>
    <h1>データで選ぶ。<span class="blue">買わないレースも選ぶ。</span></h1>
    <p>予想を増やすのではなく、条件を満たしたレースだけを公開。結果もそのまま残します。</p>
  </section>

  <section class="actions" aria-label="メイン導線">
    <a class="cta primary" href="/today.html"><span>本日の予想を見る</span><span class="arrow">›</span></a>
    <a class="cta secondary" href="/today.html#performance"><span>実績を見る</span><span class="arrow">›</span></a>
  </section>

  <section class="feature-grid" aria-label="ONE BOATの特徴">
    <div class="feature-card"><div class="feature-icon"><span class="doc-icon"></span></div><strong>公開予想</strong><small>厳選したレースのみ</small></div>
    <div class="feature-card"><div class="feature-icon"><span class="bars-icon"><i></i><i></i><i></i></span></div><strong>収支</strong><small>すべて公開・透明に</small></div>
    <div class="feature-card"><div class="feature-icon"><span class="skip-icon"></span></div><strong>見送り</strong><small>買わない選択も公開</small></div>
  </section>

  <div class="tagline">BETTER DATA. A BRIGHTER TOMORROW.</div>
  <div class="wave" aria-hidden="true"></div>
</main>
<script>
const b=document.getElementById('menuButton'),p=document.getElementById('menuPanel');
function closeMenu(){p.classList.remove('open');b.setAttribute('aria-expanded','false')}
b.addEventListener('click',e=>{e.stopPropagation();const open=p.classList.toggle('open');b.setAttribute('aria-expanded',String(open))});
document.addEventListener('click',e=>{if(!p.contains(e.target)&&!b.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
</script>
</body>
</html>
