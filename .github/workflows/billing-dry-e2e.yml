name: ONE BOAT Billing Dry E2E
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/billing-dry-e2e.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production checkout session creation without payment
        env:
          TEST_EMAIL: official.oneclubman+ob-billingcheck-0918@gmail.com
        run: |
          set -euo pipefail
          TEST_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          SIGNUP=$(jq -nc --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password,age20:true,terms:true,privacy:true}')
          SCODE=$(curl -sS -c /tmp/cookies.txt -o /tmp/signup.json -w '%{http_code}' -X POST -H 'Origin: https://one-boat-club.jp' -H 'Content-Type: application/json' --data "$SIGNUP" 'https://one-boat-club.jp/api/auth/signup')
          test "$SCODE" = "200"

          LOGIN=$(jq -nc --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')
          LCODE=$(curl -sS -c /tmp/cookies.txt -b /tmp/cookies.txt -o /tmp/login.json -w '%{http_code}' -X POST -H 'Origin: https://one-boat-club.jp' -H 'Content-Type: application/json' --data "$LOGIN" 'https://one-boat-club.jp/api/auth/login')
          test "$LCODE" = "200"

          DCODE=$(curl -sS -c /tmp/cookies.txt -b /tmp/cookies.txt -o /tmp/day.json -w '%{http_code}' -X POST -H 'Origin: https://one-boat-club.jp' -H 'Content-Type: application/json' --data '{"plan":"day_pass"}' 'https://one-boat-club.jp/api/member/checkout-intent')
          CCODE=$(curl -sS -c /tmp/cookies.txt -b /tmp/cookies.txt -o /tmp/club.json -w '%{http_code}' -X POST -H 'Origin: https://one-boat-club.jp' -H 'Content-Type: application/json' --data '{"plan":"club_monthly"}' 'https://one-boat-club.jp/api/member/checkout-intent')
          test "$DCODE" = "200"
          test "$CCODE" = "200"
          jq -e '.ok == true and (.url|startswith("https://checkout.stripe.com/"))' /tmp/day.json >/dev/null
          jq -e '.ok == true and (.url|startswith("https://checkout.stripe.com/"))' /tmp/club.json >/dev/null

          SESSION_CODE=$(curl -sS -b /tmp/cookies.txt -o /tmp/session.json -w '%{http_code}' 'https://one-boat-club.jp/api/member/session')
          test "$SESSION_CODE" = "200"
          jq -e '.logged_in == true and .plan == "free" and .paid_access == false' /tmp/session.json >/dev/null

          echo "signup=ok login=ok day_pass_checkout=ok club_monthly_checkout=ok unpaid_entitlement=free"
