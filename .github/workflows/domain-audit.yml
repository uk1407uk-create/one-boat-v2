name: ONE BOAT Domain Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Final production domain audit
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          echo "public_ns=$(dig +short NS one-boat-club.jp | sort | tr '\n' ',' | sed 's/,$//')"
          ROOT_CODE=$(curl -A "$UA" -sS -o /tmp/root.html -w '%{http_code}' https://one-boat-club.jp/)
          REG_CODE=$(curl -A "$UA" -sS -o /tmp/register.html -w '%{http_code}' https://one-boat-club.jp/register)
          LOGIN_CODE=$(curl -A "$UA" -sS -o /tmp/login.html -w '%{http_code}' https://one-boat-club.jp/login)
          ADMIN_CODE=$(curl -A "$UA" -sS -o /tmp/admin.html -w '%{http_code}' https://admin.one-boat-club.jp/)
          OLD_CUSTOMER=$(curl -A "$UA" -sS -o /dev/null -w '%{http_code}' https://one-boat-customer.uk-1407-uk.workers.dev/)
          OLD_ADMIN=$(curl -A "$UA" -sS -o /dev/null -w '%{http_code}' https://one-boat-v2-pages.uk-1407-uk.workers.dev/)
          curl -A "$UA" -sS -D /tmp/www.headers -o /dev/null https://www.one-boat-club.jp/
          WWW_CODE=$(awk 'NR==1{print $2}' /tmp/www.headers)
          WWW_LOCATION=$(awk 'tolower($1)=="location:"{print $2}' /tmp/www.headers | tr -d '\r' | tail -1)
          test "$ROOT_CODE" = "200"
          test "$REG_CODE" = "200"
          test "$LOGIN_CODE" = "200"
          test "$ADMIN_CODE" = "200"
          test "$OLD_CUSTOMER" = "200"
          test "$OLD_ADMIN" = "200"
          test "$WWW_CODE" = "308"
          test "$WWW_LOCATION" = "https://one-boat-club.jp/"
          grep -q '本日の予想を見る' /tmp/root.html
          grep -q '無料会員登録' /tmp/register.html
          grep -q 'ログイン' /tmp/login.html
          echo "root=$ROOT_CODE register=$REG_CODE login=$LOGIN_CODE admin=$ADMIN_CODE old_customer=$OLD_CUSTOMER old_admin=$OLD_ADMIN www=$WWW_CODE location=$WWW_LOCATION"
          curl -sS -D /tmp/cors.headers -o /tmp/cors.body -X OPTIONS -H 'Origin: https://one-boat-club.jp' -H 'Access-Control-Request-Method: GET' 'https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-membership-api'
          grep -qi '^access-control-allow-origin: https://one-boat-club.jp' /tmp/cors.headers
          echo 'cors=ok'
          HEALTH_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' 'https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-membership-api/health')
          test "$HEALTH_CODE" = "200"
          grep -q '"site":"https://one-boat-club.jp"' /tmp/health.json
          grep -q '"stripe_vault_configured":true' /tmp/health.json
          echo "membership_health=$HEALTH_CODE"
          WEBHOOK_CODE=$(curl -sS -o /tmp/webhook.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Stripe-Signature: invalid' --data '{}' 'https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-stripe-webhook')
          test "$WEBHOOK_CODE" = "400"
          echo "webhook_invalid_signature_rejected=$WEBHOOK_CODE"

      - name: Align Supabase Auth URL configuration when management token exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'supabase_auth_management=token_missing'
            exit 0
          fi
          API='https://api.supabase.com/v1/projects/imhzjlxbnovjvqlyawmg/config/auth'
          CODE=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$API")
          if [ "$CODE" != "200" ]; then
            echo "supabase_auth_management=get_$CODE"
            exit 0
          fi
          python - <<'PY'
          import json
          p='/tmp/auth.json'
          x=json.load(open(p))
          old=[u.strip() for u in str(x.get('uri_allow_list') or '').split(',') if u.strip()]
          needed=['https://one-boat-club.jp/**','https://www.one-boat-club.jp/**','https://one-boat-customer.uk-1407-uk.workers.dev/**']
          merged=[]
          for u in old+needed:
              if u not in merged: merged.append(u)
          body={'site_url':'https://one-boat-club.jp','uri_allow_list':','.join(merged)}
          json.dump(body,open('/tmp/auth-patch.json','w'))
          print('auth_before_site='+str(x.get('site_url') or ''))
          print('auth_before_allowlist='+str(x.get('uri_allow_list') or ''))
          PY
          PATCH_CODE=$(curl -sS -o /tmp/auth-after.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data @/tmp/auth-patch.json "$API")
          echo "supabase_auth_patch=$PATCH_CODE"
          test "$PATCH_CODE" = "200"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/auth-after.json'))
          print('auth_site='+str(x.get('site_url') or ''))
          print('auth_allowlist='+str(x.get('uri_allow_list') or ''))
          assert x.get('site_url')=='https://one-boat-club.jp'
          assert 'https://one-boat-club.jp/**' in str(x.get('uri_allow_list') or '')
          PY
