name: ONE BOAT Domain Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Final production domain audit
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          echo "public_ns=$(dig +short NS one-boat-club.jp | sort | tr '\n' ',' | sed 's/,$//')"
          ROOT_CODE=$(curl -A "$UA" -sS -o /tmp/root.html -w '%{http_code}' https://one-boat-club.jp/)
          REG_CODE=$(curl -A "$UA" -sS -o /tmp/register.html -w '%{http_code}' https://one-boat-club.jp/register)
          LOGIN_CODE=$(curl -A "$UA" -sS -o /tmp/login.html -w '%{http_code}' https://one-boat-club.jp/login)
          ADMIN_CODE=$(curl -A "$UA" -sS -o /tmp/admin.html -w '%{http_code}' https://admin.one-boat-club.jp/)
          OLD_CUSTOMER=$(curl -A "$UA" -sS -o /dev/null -w '%{http_code}' https://one-boat-customer.uk-1407-uk.workers.dev/)
          OLD_ADMIN=$(curl -A "$UA" -sS -o /dev/null -w '%{http_code}' https://one-boat-v2-pages.uk-1407-uk.workers.dev/)
          curl -A "$UA" -sS -D /tmp/www.headers -o /dev/null https://www.one-boat-club.jp/
          WWW_CODE=$(awk 'NR==1{print $2}' /tmp/www.headers)
          WWW_LOCATION=$(awk 'tolower($1)=="location:"{print $2}' /tmp/www.headers | tr -d '\r' | tail -1)
          test "$ROOT_CODE" = "200"
          test "$REG_CODE" = "200"
          test "$LOGIN_CODE" = "200"
          test "$ADMIN_CODE" = "200"
          test "$OLD_CUSTOMER" = "200"
          test "$OLD_ADMIN" = "200"
          test "$WWW_CODE" = "308"
          test "$WWW_LOCATION" = "https://one-boat-club.jp/"
          grep -q '本日の予想を見る' /tmp/root.html
          grep -q '無料会員登録' /tmp/register.html
          grep -q 'ログイン' /tmp/login.html
          echo "root=$ROOT_CODE register=$REG_CODE login=$LOGIN_CODE admin=$ADMIN_CODE old_customer=$OLD_CUSTOMER old_admin=$OLD_ADMIN www=$WWW_CODE location=$WWW_LOCATION"
          curl -sS -D /tmp/cors.headers -o /tmp/cors.body -X OPTIONS -H 'Origin: https://one-boat-club.jp' -H 'Access-Control-Request-Method: GET' 'https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-membership-api'
          grep -qi '^access-control-allow-origin: https://one-boat-club.jp' /tmp/cors.headers
          echo 'cors=ok'
          HEALTH_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' 'https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-membership-api/health')
          test "$HEALTH_CODE" = "200"
          grep -q '"site":"https://one-boat-club.jp"' /tmp/health.json
          grep -q '"stripe_vault_configured":true' /tmp/health.json
          echo "membership_health=$HEALTH_CODE"
          WEBHOOK_CODE=$(curl -sS -o /tmp/webhook.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Stripe-Signature: invalid' --data '{}' 'https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-stripe-webhook')
          test "$WEBHOOK_CODE" = "400"
          echo "webhook_invalid_signature_rejected=$WEBHOOK_CODE"





      - name: Verify one-tap page PRO mode production
        run: |
          set -euo pipefail
          BASE='https://one-boat-club.jp'
          PAGE=$(curl -sS "$BASE/today.html")
          APP=$(curl -sS "$BASE/app.js?v=20260918-pagepro1")
          printf '%s' "$PAGE" | grep -q 'id="page-mode-easy"'
          printf '%s' "$PAGE" | grep -q 'id="page-mode-pro"'
          printf '%s' "$PAGE" | grep -q 'html.pro-mode body'
          printf '%s' "$PAGE" | grep -q 'PRO MODE / DEEP ANALYSIS'
          printf '%s' "$APP" | grep -q 'function applyPageMode'
          printf '%s' "$APP" | grep -q "applyPageMode('pro')"
          printf '%s' "$APP" | grep -q "applyPageMode('easy')"
          echo "page_pro_mode=ok"

      - name: Verify beginner and PRO mode production
        run: |
          set -euo pipefail
          BASE='https://one-boat-club.jp'
          TODAY_CODE=$(curl -sS -o /tmp/today.html -w '%{http_code}' "$BASE/today.html")
          APP_CODE=$(curl -sS -o /tmp/app.js -w '%{http_code}' "$BASE/app.js?v=20260918-mode1")
          PRO_CODE=$(curl -sS -o /tmp/pro.html -w '%{http_code}' "$BASE/analysis.html?date=2026-09-17&venue=24&race=10&mode=pro")
          PRO_JS_CODE=$(curl -sS -o /tmp/pro.js -w '%{http_code}' "$BASE/analysis.js?v=20260918-mode2")
          PRO_CSS_CODE=$(curl -sS -o /tmp/pro.css -w '%{http_code}' "$BASE/analysis.css?v=20260918-mode2")
          test "$TODAY_CODE" = "200"
          test "$APP_CODE" = "200"
          test "$PRO_CODE" = "200"
          test "$PRO_JS_CODE" = "200"
          test "$PRO_CSS_CODE" = "200"
          grep -q "race-mode-switch" /tmp/app.js
          grep -q "proRaceUrl" /tmp/app.js
          grep -q 'id="easy-mode-link"' /tmp/pro.html
          grep -q 'id="pro-official"' /tmp/pro.html
          grep -q 'id="motor-pro-panel"' /tmp/pro.html
          grep -q "renderOfficialPrediction" /tmp/pro.js
          grep -q "renderMotorDetails" /tmp/pro.js
          grep -q "Beginner / PRO one-tap mode" /tmp/pro.css

          API='https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-race-analysis-api?date=2026-09-17&venue=24&race=10'
          API_CODE=$(curl -sS -H 'Origin: https://one-boat-club.jp' -o /tmp/race-analysis.json -w '%{http_code}' "$API")
          test "$API_CODE" = "200"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/race-analysis.json'))
          assert x.get('ok') is True
          assert 'motor_stats' in (x.get('source_status') or {})
          racers=x.get('racers') or []
          motors=[r.get('motor') for r in racers if isinstance(r,dict) and r.get('motor')]
          print('motor_status='+str((x.get('source_status') or {}).get('motor_stats')))
          print('motor_rows='+str(len(motors)))
          if motors:
              print('motor_numbers='+','.join(str(m.get('number')) for m in motors if m.get('number') is not None))
          PY
          echo "view_modes=ok today=$TODAY_CODE app=$APP_CODE pro=$PRO_CODE pro_js=$PRO_JS_CODE pro_css=$PRO_CSS_CODE api=$API_CODE"

      - name: Align Supabase Auth URL configuration when management token exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'supabase_auth_management=token_missing'
            exit 0
          fi
          API='https://api.supabase.com/v1/projects/imhzjlxbnovjvqlyawmg/config/auth'
          CODE=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$API")
          if [ "$CODE" != "200" ]; then
            echo "supabase_auth_management=get_$CODE"
            exit 0
          fi
          python - <<'PY'
          import json
          p='/tmp/auth.json'
          x=json.load(open(p))
          old=[u.strip() for u in str(x.get('uri_allow_list') or '').split(',') if u.strip()]
          needed=['https://one-boat-club.jp/**','https://www.one-boat-club.jp/**','https://one-boat-customer.uk-1407-uk.workers.dev/**']
          merged=[]
          for u in old+needed:
              if u not in merged: merged.append(u)
          body={'site_url':'https://one-boat-club.jp','uri_allow_list':','.join(merged)}
          json.dump(body,open('/tmp/auth-patch.json','w'))
          print('auth_before_site='+str(x.get('site_url') or ''))
          print('auth_before_allowlist='+str(x.get('uri_allow_list') or ''))
          PY
          PATCH_CODE=$(curl -sS -o /tmp/auth-after.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data @/tmp/auth-patch.json "$API")
          echo "supabase_auth_patch=$PATCH_CODE"
          test "$PATCH_CODE" = "200"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/auth-after.json'))
          print('auth_site='+str(x.get('site_url') or ''))
          print('auth_allowlist='+str(x.get('uri_allow_list') or ''))
          assert x.get('site_url')=='https://one-boat-club.jp'
          assert 'https://one-boat-club.jp/**' in str(x.get('uri_allow_list') or '')
          PY


      - name: Verify realistic start exhibition production assets
        run: |
          set -euo pipefail
          BASE='https://one-boat-club.jp'
          PAGE_CODE=$(curl -sS -o /tmp/analysis.html -w '%{http_code}' "$BASE/analysis.html?date=2026-09-17&venue=24&race=10")
          JS_CODE=$(curl -sS -o /tmp/analysis.js -w '%{http_code}' "$BASE/analysis.js?v=20260918-mode2")
          CSS_CODE=$(curl -sS -o /tmp/analysis.css -w '%{http_code}' "$BASE/analysis.css?v=20260918-mode2")
          test "$PAGE_CODE" = "200"
          test "$JS_CODE" = "200"
          test "$CSS_CODE" = "200"
          grep -q 'analysis.js?v=20260918-mode2' /tmp/analysis.html
          grep -q 'analysis.css?v=20260918-mode2' /tmp/analysis.html
          grep -q 'start-boat-' /tmp/analysis.js
          grep -q 'start-water.webp?v=20260918-realboat1' /tmp/analysis.css
          for n in 1 2 3 4 5 6; do
            CODE=$(curl -sS -D /tmp/boat-$n.headers -o /tmp/boat-$n.webp -w '%{http_code}' "$BASE/assets/start-boat-$n.webp?v=20260918-realboat1")
            test "$CODE" = "200"
            grep -qi '^content-type: image/webp' /tmp/boat-$n.headers
            test $(wc -c < /tmp/boat-$n.webp) -gt 1500
          done
          WATER_CODE=$(curl -sS -D /tmp/water.headers -o /tmp/water.webp -w '%{http_code}' "$BASE/assets/start-water.webp?v=20260918-realboat1")
          test "$WATER_CODE" = "200"
          grep -qi '^content-type: image/webp' /tmp/water.headers
          echo "start_exhibition_production=ok page=$PAGE_CODE js=$JS_CODE css=$CSS_CODE water=$WATER_CODE boats=6"
