name: ONE BOAT Domain Audit

on:
  push:
    paths:
      - '.github/workflows/domain-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit Cloudflare zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'cloudflare_credentials=missing'
            exit 2
          fi
          RESP=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=one-boat-club.jp&status=active')
          python - <<'PY' "$RESP"
          import json,sys
          d=json.loads(sys.argv[1])
          print('api_success='+str(bool(d.get('success'))).lower())
          rs=d.get('result') or []
          print('zone_found='+str(bool(rs)).lower())
          if rs:
              z=rs[0]
              print('zone_status='+str(z.get('status')))
              print('zone_id='+str(z.get('id')))
              print('name_servers='+','.join(z.get('name_servers') or []))
          PY
