name: ONE BOAT Domain Audit

on:
  push:
    paths:
      - '.github/workflows/domain-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Cloudflare zone exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'cloudflare_credentials=missing'
            exit 2
          fi
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          RESP=$(curl -fsS "${AUTH[@]}" 'https://api.cloudflare.com/client/v4/zones?name=one-boat-club.jp')
          ZONE_ID=$(python - <<'PY' "$RESP"
import json,sys
d=json.loads(sys.argv[1]); rs=d.get('result') or []
print(rs[0].get('id','') if rs else '')
PY
          )
          if [ -z "$ZONE_ID" ]; then
            BODY=$(python - <<'PY'
import json,os
print(json.dumps({'account':{'id':os.environ['CLOUDFLARE_ACCOUNT_ID']},'name':'one-boat-club.jp','type':'full'}))
PY
            )
            RESP=$(curl -fsS -X POST "${AUTH[@]}" --data "$BODY" 'https://api.cloudflare.com/client/v4/zones')
          fi
          python - <<'PY' "$RESP"
import json,sys
d=json.loads(sys.argv[1])
print('api_success='+str(bool(d.get('success'))).lower())
rs=d.get('result')
if isinstance(rs,list): z=rs[0] if rs else None
else: z=rs
print('zone_found='+str(bool(z)).lower())
if z:
    print('zone_status='+str(z.get('status')))
    print('zone_id='+str(z.get('id')))
    print('name_servers='+','.join(z.get('name_servers') or []))
if d.get('errors'):
    print('errors='+json.dumps(d.get('errors'),ensure_ascii=False))
PY
