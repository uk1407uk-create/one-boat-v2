name: ONE BOAT Domain Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check public DNS and Cloudflare zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "public_ns=$(dig +short NS one-boat-club.jp | sort | tr '\n' ',' | sed 's/,$//')"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones?name=one-boat-club.jp" -o /tmp/zone.json
          ZONE_ID=$(python - <<'PY'
import json
x=json.load(open('/tmp/zone.json'))
rs=x.get('result') or []
print(rs[0].get('id','') if rs else '')
PY
          )
          if [ -n "$ZONE_ID" ]; then
            curl -sS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/activation_check" >/tmp/activation.json || true
            sleep 2
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/zones?name=one-boat-club.jp" -o /tmp/zone.json
          fi
          python - <<'PY'
import json
x=json.load(open('/tmp/zone.json'))
rs=x.get('result') or []
print('success=',x.get('success'))
print('count=',len(rs))
if rs:
    z=rs[0]
    print('status=',z.get('status'))
    print('paused=',z.get('paused'))
    print('name_servers=',','.join(z.get('name_servers') or []))
    print('original_name_servers=',','.join(z.get('original_name_servers') or []))
PY
