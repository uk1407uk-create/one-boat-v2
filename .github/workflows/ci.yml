name: ONE BOAT CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Frontend boot smoke test
        run: node tests/ui-smoke.mjs
      - name: Validate Cloudflare Worker build
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
