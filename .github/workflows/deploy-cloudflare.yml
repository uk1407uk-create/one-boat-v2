name: Deploy ONE BOAT to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment credentials are not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Validate early final decision cron
        run: |
          set -euo pipefail
          grep -q "left>=0&&left<=20" worker_obpe_social.js
          grep -q "_early_ready','1'" worker_obpe_social.js
          grep -q "early_final_window_minutes:20" worker_obpe_social.js
          grep -q "必要データがそろい次第すぐ最終判定" worker_obpe_social.js
          grep -q "v==='ENTER'||v==='SKIP'" worker_obpe_social.js
          grep -q "markCronLocked(origin,raceCode,p?.decision)" worker_obpe_social.js
          grep -q 'WATCHは固定せず毎分再判定' worker_obpe_social.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
