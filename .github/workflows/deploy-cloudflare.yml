name: Deploy ONE BOAT to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment credentials are not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Inject one-time ntfy probe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker_obpe_notify.js')
          s=p.read_text()
          needle="      const u=new URL(request.url);\n      if(u.pathname==='/api/notify-status'){"
          insert="""      const u=new URL(request.url);
      if(u.pathname==='/__ntfy_probe_cf_20260916_1254'){
        try{
          const x=await sendNtfy({title:'✅ ONE BOAT Cloudflare送信確認',message:'Cloudflare Worker → ntfy → iPhone の送信テストです。',sequenceId:'ob-cf-probe-20260916-1254',priority:5});
          return new Response(JSON.stringify({ok:true,ntfy:x}),{headers:{'content-type':'application/json;charset=utf-8','cache-control':'no-store'}});
        }catch(e){
          return new Response(JSON.stringify({ok:false,error:String(e?.message||e)}),{status:500,headers:{'content-type':'application/json;charset=utf-8','cache-control':'no-store'}});
        }
      }
      if(u.pathname==='/api/notify-status'){"""
          if needle not in s:
              raise SystemExit('probe injection needle not found')
          p.write_text(s.replace(needle,insert,1))
          PY
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Probe Cloudflare to ntfy
        run: |
          sleep 3
          curl -sS -i --max-time 20 https://one-boat-v2-pages.uk-1407-uk.workers.dev/__ntfy_probe_cf_20260916_1254
