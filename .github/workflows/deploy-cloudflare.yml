name: Deploy ONE BOAT to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment credentials are not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Validate early final decision cron
        run: |
          set -euo pipefail

          require_fixed() {
            local needle="$1"
            if ! grep -Fq -- "$needle" worker_obpe_social.js; then
              echo "Missing required early-final invariant: $needle"
              exit 1
            fi
          }

          require_fixed "left>=0&&left<=20"
          require_fixed "_early_ready','1'"
          require_fixed "early_final_window_minutes:20"
          require_fixed "必要データがそろい次第ENTER/見送りを確定"
          require_fixed "v==='ENTER'||v==='SKIP'"
          require_fixed "markCronLocked(origin,raceCode,p?.decision)"
          require_fixed "WATCHは固定せず毎分再判定"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
