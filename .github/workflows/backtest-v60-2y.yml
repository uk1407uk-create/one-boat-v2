name: ONE BOAT V6 2Y Backtest

on:
  push:
    paths:
      - 'scripts/backtest_v60_2y.mjs'
      - '.github/workflows/backtest-v60-2y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run two-year historical-safe backtest
        env:
          BACKTEST_START: '2024-09-15'
          BACKTEST_END: '2026-09-14'
          BACKTEST_WARMUP_DAYS: '180'
          BACKTEST_CONCURRENCY: '8'
        run: node scripts/backtest_v60_2y.mjs
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: one-boat-v60-backtest-2y
          path: |
            reports/backtest-v60-2y.json
            reports/backtest-v60-2y.md
          retention-days: 14
