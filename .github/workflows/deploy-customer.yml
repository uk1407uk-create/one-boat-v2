name: Deploy ONE BOAT Customer to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'customer-public/**'
      - 'worker_customer.js'
      - 'wrangler.customer.jsonc'
      - '.github/workflows/deploy-customer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Rebuild approved high-resolution hero
        run: |
          set -euo pipefail
          cat customer-public/assets/home-exact-{00..09}.txt | tr -d '\r\n' | base64 -d > customer-public/hero-top.webp
          python - <<'PY'
          from pathlib import Path
          b=Path('customer-public/hero-top.webp').read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', f'not webp: {b[:16]!r}'
          assert len(b) > 80000, f'hero too small: {len(b)} bytes'
          print('rebuilt_hero_webp_ok', len(b))
          PY
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment credentials are not configured."
            exit 1
          fi
      - name: Deploy customer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.customer.jsonc
      - name: Verify deployed customer site
        run: |
          set -euo pipefail
          BASE='https://one-boat-customer.uk-1407-uk.workers.dev'
          sleep 2

          ROOT_CODE=$(curl -sS --max-redirs 0 -o /tmp/root.html -D /tmp/root.headers -w '%{http_code}' "$BASE/")
          echo "root_status=$ROOT_CODE"
          cat /tmp/root.headers
          test "$ROOT_CODE" = '200'
          grep -q 'ONE BOAT' /tmp/root.html
          grep -q 'hero-top.webp?v=4' /tmp/root.html

          HEALTH_CODE=$(curl -sS --max-redirs 0 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health")
          echo "health_status=$HEALTH_CODE"
          cat /tmp/health.json
          test "$HEALTH_CODE" = '200'
          grep -q '2026-09-17.6' /tmp/health.json

          HERO_CODE=$(curl -sS --max-redirs 0 -o /tmp/hero.webp -D /tmp/hero.headers -w '%{http_code}' "$BASE/hero-top.webp?v=4")
          echo "hero_status=$HERO_CODE"
          cat /tmp/hero.headers
          test "$HERO_CODE" = '200'
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/hero.webp').read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', f'not webp: {b[:16]!r}'
          assert len(b) > 80000, f'deployed hero too small: {len(b)} bytes'
          print('deployed_hero_webp_ok', len(b))
          PY
