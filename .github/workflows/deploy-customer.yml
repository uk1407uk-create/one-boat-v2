name: Deploy ONE BOAT Customer to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'customer-public/**'
      - 'worker_customer.js'
      - 'wrangler.customer.jsonc'
      - '.github/workflows/deploy-customer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment credentials are not configured."
            exit 1
          fi
      - name: Deploy customer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.customer.jsonc
      - name: Verify deployed customer site
        run: |
          set -euo pipefail
          BASE='https://one-boat-customer.uk-1407-uk.workers.dev'
          sleep 2

          ROOT_CODE=$(curl -sS --max-redirs 0 -o /tmp/root.html -D /tmp/root.headers -w '%{http_code}' "$BASE/")
          echo "root_status=$ROOT_CODE"
          cat /tmp/root.headers
          test "$ROOT_CODE" = '200'
          grep -q 'ONE BOAT' /tmp/root.html

          HEALTH_CODE=$(curl -sS --max-redirs 0 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health")
          echo "health_status=$HEALTH_CODE"
          cat /tmp/health.json
          test "$HEALTH_CODE" = '200'
          grep -q '2026-09-17.5' /tmp/health.json

          HERO_CODE=$(curl -sS --max-redirs 0 -o /tmp/hero.jpg -w '%{http_code}' "$BASE/hero-top.jpg?v=3")
          echo "hero_status=$HERO_CODE"
          test "$HERO_CODE" = '200'
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/hero.jpg').read_bytes()
          assert b[:2] == b'\xff\xd8', f'not jpeg: {b[:12]!r}'
          print('hero_jpeg_ok', len(b))
          PY
