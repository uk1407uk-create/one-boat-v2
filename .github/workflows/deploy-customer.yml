name: Deploy ONE BOAT Customer to Cloudflare Workers
on:
  push:
    branches: [main]
    paths: ['customer-public/**','worker_customer.js','worker_customer_hero.js','wrangler.customer.jsonc','.github/workflows/deploy-customer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Rebuild hero source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          s=''.join(Path(f'customer-public/assets/home-exact-{i:02d}.txt').read_text().strip() for i in range(10))
          s += '='*((4-len(s)%4)%4)
          Path('customer-public/hero-top.webp').write_bytes(base64.b64decode(s))
          PY
      - name: Deploy customer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.customer.jsonc
      - name: Verify deployed customer site
        run: |
          set -euo pipefail
          BASE='https://one-boat-customer.uk-1407-uk.workers.dev'
          sleep 3
          curl -fsS "$BASE/?v=20260917-exact1" -o /tmp/root.html
          grep -q '/top-screen.webp?v=20260917-exact1' /tmp/root.html
          curl -fsS "$BASE/top-screen.webp?v=20260917-exact1" -o /tmp/top.webp
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/top.webp').read_bytes()
          assert b[:4]==b'RIFF', b[:16]
          assert b[8:12]==b'WEBP', b[:16]
          assert len(b)>50000, len(b)
          print('top_webp_ok',len(b))
          PY
          curl -fsS "$BASE/api/health" | grep -q 'ONE BOAT CUSTOMER'
          curl -fsS "$BASE/api/public/stats" | grep -q 'threads_free_public_only'
