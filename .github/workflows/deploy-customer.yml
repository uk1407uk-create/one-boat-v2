name: Deploy ONE BOAT Customer to Cloudflare Workers
on:
  push:
    branches: [main]
    paths: ['customer-public/**','worker_customer.js','worker_customer_hero.js','wrangler.customer.jsonc','.github/workflows/deploy-customer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Rebuild exact approved top image
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts=[]
          for i in range(10):
              p=Path(f'customer-public/assets/home-exact-{i:02d}.txt')
              assert p.exists() and p.stat().st_size > 0, p
              parts.append(p.read_text().strip())
          s=''.join(parts)
          s += '='*((4-len(s)%4)%4)
          b=base64.b64decode(s)
          assert b[:4] == b'RIFF', b[:16]
          assert b[8:12] == b'WEBP', b[:16]
          assert len(b) > 50000, len(b)
          out=Path('customer-public/assets/oneboat-top.webp')
          out.write_bytes(b)
          print('oneboat_top_bytes',len(b))
          print('oneboat_top_sha256',hashlib.sha256(b).hexdigest())
          PY

      - name: Validate customer assets before deploy
        run: |
          set -euo pipefail
          test -s customer-public/index.html
          test -s customer-public/assets/oneboat-top.webp
          test -s customer-public/today.html
          grep -q 'assets/oneboat-top.webp?v=20260917-exact2' customer-public/index.html
          grep -q 'href="/today.html"' customer-public/index.html
          grep -q '本日の予想を見る' customer-public/index.html
          ! grep -q 'hero-reference.svg' customer-public/index.html
          grep -q '本日の24場' customer-public/today.html
          sha256sum customer-public/assets/oneboat-top.webp > /tmp/oneboat-top.sha256

      - name: Deploy customer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.customer.jsonc

      - name: Verify deployed customer site with iPhone-like requests
        run: |
          set -euo pipefail
          BASE='https://one-boat-customer.uk-1407-uk.workers.dev'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          sleep 4

          curl -fsS -A "$UA" -H 'Cache-Control: no-cache' "$BASE/?v=20260917-exact2" -o /tmp/root.html
          grep -q 'assets/oneboat-top.webp?v=20260917-exact2' /tmp/root.html
          grep -q '本日の予想を見る' /tmp/root.html
          grep -q 'href="/today.html"' /tmp/root.html
          ! grep -q 'hero-reference.svg' /tmp/root.html

          curl -fsS -A "$UA" -H 'Accept: image/avif,image/webp,image/*,*/*;q=0.8' "$BASE/assets/oneboat-top.webp?v=20260917-exact2" -o /tmp/live-top.webp
          python - <<'PY'
          from pathlib import Path
          import hashlib
          local=Path('customer-public/assets/oneboat-top.webp').read_bytes()
          live=Path('/tmp/live-top.webp').read_bytes()
          assert live[:4] == b'RIFF', live[:16]
          assert live[8:12] == b'WEBP', live[:16]
          assert len(live) == len(local), (len(live),len(local))
          assert hashlib.sha256(live).digest() == hashlib.sha256(local).digest()
          print('live_top_exact_match',len(live),hashlib.sha256(live).hexdigest())
          PY
          curl -fsSI -A "$UA" "$BASE/assets/oneboat-top.webp?v=20260917-exact2" | tr -d '\r' | grep -Eqi '^content-type: image/webp'

          curl -fsS -A "$UA" "$BASE/today.html?v=20260917-exact2" -o /tmp/today.html
          grep -q '本日の24場' /tmp/today.html
          grep -q 'venue-grid' /tmp/today.html
          grep -q 'performance' /tmp/today.html

          curl -fsS -A "$UA" "$BASE/api/health" | grep -q 'ONE BOAT CUSTOMER'
          curl -fsS -A "$UA" "$BASE/api/public/stats" | grep -q 'threads_free_public_only'
          echo 'customer_live_iphone_verify_ok'
