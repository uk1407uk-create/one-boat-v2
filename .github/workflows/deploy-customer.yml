name: Deploy ONE BOAT Customer to Cloudflare Workers
on:
  push:
    branches: [main]
    paths: ['customer-public/**','worker_customer.js','worker_customer_hero.js','wrangler.customer.jsonc','.github/workflows/deploy-customer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Deploy customer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.customer.jsonc
      - name: Verify deployed customer site
        run: |
          set -euo pipefail
          BASE='https://one-boat-customer.uk-1407-uk.workers.dev'
          sleep 4

          curl -fsS "$BASE/?v=20260917-native1" -o /tmp/root.html
          grep -q 'hero-reference.svg?v=20260917-native1' /tmp/root.html
          grep -q 'href="/today.html"' /tmp/root.html
          grep -q '本日の予想を見る' /tmp/root.html
          if grep -q 'top-screen.webp' /tmp/root.html; then
            echo 'old fragile top image reference is still present' >&2
            exit 1
          fi

          curl -fsS "$BASE/hero-reference.svg?v=20260917-native1" -o /tmp/hero.svg
          grep -q '<svg' /tmp/hero.svg
          test "$(wc -c < /tmp/hero.svg)" -gt 10000

          curl -fsS "$BASE/today.html?v=20260917-native1" -o /tmp/today.html
          grep -q '本日の24場' /tmp/today.html
          grep -q 'venue-grid' /tmp/today.html
          grep -q 'performance' /tmp/today.html

          curl -fsS "$BASE/api/health" | grep -q 'ONE BOAT CUSTOMER'
          curl -fsS "$BASE/api/public/stats" | grep -q 'threads_free_public_only'

          echo 'customer_live_verify_ok'
