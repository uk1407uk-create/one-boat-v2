name: Deploy ONE BOAT Customer to Cloudflare Workers
on:
  push:
    branches: [main]
    paths: ['customer-public/**','worker_customer.js','worker_customer_hero.js','worker_member.js','wrangler.customer.jsonc','.github/workflows/deploy-customer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Rebuild exact approved top image archive
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts=[]
          for i in range(10):
              p=Path(f'customer-public/assets/home-exact-{i:02d}.txt')
              assert p.exists() and p.stat().st_size > 0, p
              parts.append(p.read_text().strip())
          s=''.join(parts); s += '='*((4-len(s)%4)%4); b=base64.b64decode(s)
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP' and len(b) > 50000
          Path('customer-public/assets/oneboat-top.webp').write_bytes(b)
          print('oneboat_top_sha256',hashlib.sha256(b).hexdigest())
          PY

      - name: Rebuild selected customer hero
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts=[]
          for i in range(5):
              p=Path(f'customer-public/hero-chunk-{i}.txt')
              assert p.exists() and p.stat().st_size > 0, p
              parts.append(p.read_text().strip())
          s=''.join(parts); s += '='*((4-len(s)%4)%4); b=base64.b64decode(s)
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP' and len(b) > 20000
          Path('customer-public/assets/customer-hero.webp').write_bytes(b)
          print('customer_hero_sha256',hashlib.sha256(b).hexdigest())
          PY

      - name: Upload existing customer images for inspection
        uses: actions/upload-artifact@v4
        with:
          name: customer-image-assets
          path: |
            customer-public/assets/*.webp
            customer-public/hero-reference.svg
          if-no-files-found: warn
          retention-days: 1

      - name: Validate customer site before deploy
        run: |
          set -euo pipefail
          test -s customer-public/index.html
          test -s customer-public/assets/customer-hero.webp
          test -s customer-public/today.html
          test -s customer-public/club.html
          test -s customer-public/signup.html
          test -s customer-public/login.html
          test -s customer-public/mypage.html
          test -s customer-public/premium.html
          test -s customer-public/member.css
          test -s customer-public/member.js
          test -s customer-public/terms.html
          test -s customer-public/privacy.html
          test -s customer-public/commercial.html
          test -s customer-public/refund.html
          test -s worker_member.js
          grep -Eq 'hero-reference\.svg\?v=20260918-native1|assets/customer-hero\.webp\?v=20260918-selected2' customer-public/index.html
          grep -q 'href="/today.html"' customer-public/index.html
          grep -q '本日の予想を見る' customer-public/index.html
          grep -q '買わないレースも選ぶ。' customer-public/index.html
          grep -q 'feature-grid' customer-public/index.html
          grep -q '本日の24場' customer-public/today.html
          grep -q '料金・利用プラン' customer-public/club.html
          grep -q '20歳以上' customer-public/signup.html
          grep -q '/api/auth/login' customer-public/member.js
          grep -q '/api/member/checkout-intent' customer-public/member.js
          grep -q "import base from './worker_member.js'" worker_customer_hero.js

      - name: Deploy customer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.customer.jsonc

      - name: Verify deployed customer site with iPhone-like requests
        run: |
          set -euo pipefail
          BASE='https://one-boat-club.jp'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          sleep 4
          get_text() { curl -fsS -A "$UA" -H 'Cache-Control: no-cache' "$1" -o "$2"; }
          get_text "$BASE/?v=20260918-selected2" /tmp/root.html
          grep -q '本日の予想を見る' /tmp/root.html
          curl -fSs -D /tmp/hero.headers -A "$UA" "$BASE/assets/customer-hero.webp?v=20260918-selected2" -o /tmp/customer-hero.webp
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/customer-hero.webp').read_bytes(); assert b[:4]==b'RIFF' and b[8:12]==b'WEBP' and len(b)>20000
          PY
          get_text "$BASE/today.html?v=20260918-member1" /tmp/today.html
          grep -q '本日の24場' /tmp/today.html
          get_text "$BASE/club.html?v=20260918-member1" /tmp/club.html
          grep -q '使い方に合わせて' /tmp/club.html
          get_text "$BASE/register?v=20260918-domain1" /tmp/register.html
          grep -q '無料会員登録' /tmp/register.html
          get_text "$BASE/login?v=20260918-domain1" /tmp/login.html
          grep -q 'ログイン' /tmp/login.html
          get_text "$BASE/api/health" /tmp/health.json
          grep -q 'ONE BOAT CUSTOMER' /tmp/health.json
          get_text "$BASE/api/public/stats" /tmp/stats.json
          grep -q 'public_only' /tmp/stats.json
          get_text "$BASE/api/member/session" /tmp/session.json
          grep -q 'logged_in' /tmp/session.json
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" "$BASE/premium.html")
          test "$CODE" = "302"
          LEGACY='https://one-boat-customer.uk-1407-uk.workers.dev'
          LEGACY_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" "$LEGACY/analysis.html?date=2026-09-18&venue=14&race=3")
          test "$LEGACY_CODE" = "308"
          LEGACY_LOCATION=$(curl -sSI -A "$UA" "$LEGACY/analysis.html?date=2026-09-18&venue=14&race=3" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | tail -1)
          test "$LEGACY_LOCATION" = "https://one-boat-club.jp/analysis.html?date=2026-09-18&venue=14&race=3"
          echo 'customer_membership_iphone_verify_ok'
