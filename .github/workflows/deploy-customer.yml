name: Deploy ONE BOAT Customer to Cloudflare Workers
on:
  push:
    branches: [main]
    paths: ['customer-public/**','worker_customer.js','worker_customer_hero.js','wrangler.customer.jsonc','.github/workflows/deploy-customer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate customer assets before deploy
        run: |
          set -euo pipefail
          test -s customer-public/index.html
          test -s customer-public/hero-reference.svg
          test -s customer-public/today.html
          grep -q 'hero-reference.svg?v=20260917-final1' customer-public/index.html
          grep -q 'href="/today.html"' customer-public/index.html
          grep -q '本日の予想を見る' customer-public/index.html
          ! grep -q 'top-screen.webp' customer-public/index.html
          grep -q '本日の24場' customer-public/today.html
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('customer-public/hero-reference.svg')
          ET.fromstring(p.read_text())
          assert p.stat().st_size > 10000
          print('hero_svg_ok',p.stat().st_size)
          PY
      - name: Deploy customer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.customer.jsonc
      - name: Verify deployed customer site with iPhone-like requests
        run: |
          set -euo pipefail
          BASE='https://one-boat-customer.uk-1407-uk.workers.dev'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          sleep 4

          curl -fsS -A "$UA" -H 'Cache-Control: no-cache' "$BASE/?v=20260917-final1" -o /tmp/root.html
          grep -q 'hero-reference.svg?v=20260917-final1' /tmp/root.html
          grep -q '本日の予想を見る' /tmp/root.html
          grep -q 'href="/today.html"' /tmp/root.html
          ! grep -q 'top-screen.webp' /tmp/root.html

          curl -fsS -A "$UA" -H 'Accept: image/svg+xml,image/*,*/*;q=0.8' "$BASE/hero-reference.svg?v=20260917-final1" -o /tmp/hero.svg
          grep -q '<svg' /tmp/hero.svg
          test "$(wc -c < /tmp/hero.svg)" -gt 10000
          curl -fsSI -A "$UA" "$BASE/hero-reference.svg?v=20260917-final1" | tr -d '\r' | grep -Eqi '^content-type: (image/svg\+xml|text/xml|application/xml)'

          curl -fsS -A "$UA" "$BASE/today.html?v=20260917-final1" -o /tmp/today.html
          grep -q '本日の24場' /tmp/today.html
          grep -q 'venue-grid' /tmp/today.html
          grep -q 'performance' /tmp/today.html

          curl -fsS -A "$UA" "$BASE/api/health" | grep -q 'ONE BOAT CUSTOMER'
          curl -fsS -A "$UA" "$BASE/api/public/stats" | grep -q 'threads_free_public_only'
          echo 'customer_live_iphone_verify_ok'
