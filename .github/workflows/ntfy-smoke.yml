name: ONE BOAT ntfy smoke test

on:
  push:
    paths:
      - '.github/workflows/ntfy-smoke.yml'

jobs:
  test:
    if: github.event.head_commit.message == 'Retest both ntfy topic variants'
    runs-on: ubuntu-latest
    steps:
      - name: Send ONE BOAT test notification to both variants
        run: |
          for TOPIC in \
            'oneboat-IRL62UvsjkKYfHCuSjEuqr6qhRDtX9' \
            'oneboat-IRL62UvsjkKYfHCuSjEuqr6qh-RDtX9'
          do
            echo "Sending to $TOPIC"
            HTTP_CODE=$(curl -sS -o /tmp/ntfy.json -w '%{http_code}' \
              -X POST "https://ntfy.sh/${TOPIC}" \
              -H 'Title: ONE BOAT 通知テスト' \
              -H 'Priority: 4' \
              --data-binary '接続確認です。これが届けば通知ルートは正常です。')
            cat /tmp/ntfy.json
            test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
          done
