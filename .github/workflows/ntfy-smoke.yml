name: ONE BOAT ntfy smoke test

on:
  push:
    paths:
      - '.github/workflows/ntfy-smoke.yml'

jobs:
  test:
    if: github.event.head_commit.message == 'ONE BOAT ntfy smoke test'
    runs-on: ubuntu-latest
    steps:
      - name: Send ONE BOAT test notification
        run: |
          TOPIC='oneboat-IRL62UvsjkKYfHCuSjEuqr6qh-RDtX9'
          HTTP_CODE=$(curl -sS -o /tmp/ntfy.json -w '%{http_code}' \
            -X POST "https://ntfy.sh/${TOPIC}" \
            -H 'Title: ONE BOAT 通知テスト' \
            -H 'Priority: 4' \
            --data-binary '接続確認OKです。今後はENTERレースを締切5〜3分前に通知します。')
          cat /tmp/ntfy.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
