<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ONE BOAT｜Buffer接続</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:20px}.card{max-width:560px;margin:32px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 38px rgba(0,0,0,.08)}.brand{font-size:13px;font-weight:800;letter-spacing:.08em;color:#5a6b82;margin-bottom:8px}h1{font-size:25px;margin:0 0 12px}.sub{font-size:15px;line-height:1.7;color:#59606b;margin:0 0 22px}.field{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;font-size:16px;padding:15px;border:1px solid #cfd6df;border-radius:13px;outline:none}input:focus{border-color:#82c970;box-shadow:0 0 0 3px rgba(130,201,112,.16)}button{width:100%;margin-top:16px;padding:15px 18px;border:0;border-radius:13px;background:#a8e98d;color:#111;font-size:17px;font-weight:800}button:disabled{opacity:.55}.note{margin-top:15px;font-size:13px;line-height:1.6;color:#737b86}.status{display:none;margin-top:18px;padding:15px;border-radius:13px;font-size:15px;line-height:1.6}.status.ok{display:block;background:#edfbea;border:1px solid #a7dda0}.status.err{display:block;background:#fff1f1;border:1px solid #efb1b1}.small{font-size:12px;color:#8a919a;margin-top:14px}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ONE BOAT</div>
    <h1>Buffer APIキーを接続</h1>
    <p class="sub">BufferでコピーしたAPIキーを下に貼ってください。キーはこのページからONE BOATのSupabaseへ直接送信され、ChatGPTの会話には入りません。</p>
    <label class="field" for="key">Buffer API Key</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Buffer API Key" />
    <button id="save">安全に保存して接続確認</button>
    <div id="status" class="status"></div>
    <div class="note">※ 接続確認に成功すると、Threadsの <b>oneboat_ai</b> チャンネルを自動検出して保存します。</div>
    <div class="small">この設定リンクは1回限りです。</div>
  </div>
<script>
(function(){
  const token=new URLSearchParams(location.search).get('token')||'';
  const key=document.getElementById('key');
  const btn=document.getElementById('save');
  const status=document.getElementById('status');
  const endpoint='https://imhzjlxbnovjvqlyawmg.supabase.co/functions/v1/one-boat-buffer-key-setup?format=json&token='+encodeURIComponent(token);
  function show(msg,ok){status.className='status '+(ok?'ok':'err');status.textContent=msg}
  if(!token){show('設定用トークンがありません。ChatGPTから届いた専用リンクを開いてください。',false);btn.disabled=true;return}
  btn.addEventListener('click',async()=>{
    const v=key.value.trim();
    if(v.length<20){show('Buffer APIキーをコピーして貼り付けてください。',false);return}
    btn.disabled=true;btn.textContent='接続確認中…';status.className='status';
    try{
      const body=new URLSearchParams({api_key:v});
      const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});
      const data=await r.json().catch(()=>({ok:false,error:'invalid_response'}));
      if(!r.ok||!data.ok)throw new Error(data.error||'接続できませんでした');
      key.value='';
      show('接続できました ✅  Threads：'+(data.channel?.name||'oneboat_ai')+'\n\nChatGPTに戻って「できた」と送ってください。',true);
      btn.textContent='設定完了';
    }catch(e){show('接続確認で止まりました：'+String(e.message||e),false);btn.disabled=false;btn.textContent='安全に保存して接続確認'}
  });
})();
</script>
</body>
</html>
