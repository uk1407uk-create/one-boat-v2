<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b35"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ONE BOAT</title><link rel="stylesheet" href="/styles.css?v=20260914-1820"></head><body><header class="top"><div><div class="brand">ONE BOAT</div><div class="tag">データ重視・買わないレースも公開</div></div><div id="health" class="pill">画面稼働中</div></header><main class="wrap"><section class="stats"><div><span>的中率</span><b id="hitRate">--</b></div><div><span>回収率</span><b id="roi">--</b></div><div><span>収支</span><b id="profit">--</b></div></section><section id="listCard" class="card"><div class="sectionHead"><h1>本日の24場</h1><button id="reload" class="ghost">更新</button></div><div class="legend"><span class="dot enter"></span>予想完了 <span class="dot watch"></span>様子見 <span class="dot skip"></span>見送り</div><div id="venues" class="venues"><button class="venue skip"><b>桐生</b><span class="state">取得中</span></button><button class="venue skip"><b>戸田</b><span class="state">取得中</span></button><button class="venue skip"><b>江戸川</b><span class="state">取得中</span></button><button class="venue skip"><b>平和島</b><span class="state">取得中</span></button><button class="venue skip"><b>多摩川</b><span class="state">取得中</span></button><button class="venue skip"><b>浜名湖</b><span class="state">取得中</span></button><button class="venue skip"><b>蒲郡</b><span class="state">取得中</span></button><button class="venue skip"><b>常滑</b><span class="state">取得中</span></button><button class="venue skip"><b>津</b><span class="state">取得中</span></button><button class="venue skip"><b>三国</b><span class="state">取得中</span></button><button class="venue skip"><b>びわこ</b><span class="state">取得中</span></button><button class="venue skip"><b>住之江</b><span class="state">取得中</span></button><button class="venue skip"><b>尼崎</b><span class="state">取得中</span></button><button class="venue skip"><b>鳴門</b><span class="state">取得中</span></button><button class="venue skip"><b>丸亀</b><span class="state">取得中</span></button><button class="venue skip"><b>児島</b><span class="state">取得中</span></button><button class="venue skip"><b>宮島</b><span class="state">取得中</span></button><button class="venue skip"><b>徳山</b><span class="state">取得中</span></button><button class="venue skip"><b>下関</b><span class="state">取得中</span></button><button class="venue skip"><b>若松</b><span class="state">取得中</span></button><button class="venue skip"><b>芦屋</b><span class="state">取得中</span></button><button class="venue skip"><b>福岡</b><span class="state">取得中</span></button><button class="venue skip"><b>唐津</b><span class="state">取得中</span></button><button class="venue skip"><b>大村</b><span class="state">取得中</span></button></div></section><section id="detail" class="card hidden"><button id="back" class="ghost">← 一覧へ</button><div id="detailBody"></div></section><section class="card"><h2>本番ルール</h2><div class="rules">買う価値70以上／基本4点・最大6点／1R上限5,000円／100円単位／10分前再計算・8分前までに予想完了または見送り確定／トリガミ回避／全レース買わない。<br>中穴20.0〜59.9倍、穴60.0倍〜。<br>「✅予想完了」は decision=ENTER かつ stake_total_yen&gt;0 の時だけ表示。</div></section><section class="card"><h2>稼働状況</h2><div id="statusLog" class="log">24場表示済み／開催データ取得中</div></section></main><script>(function(){'use strict';var VENUES=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];var races=[];var busy=false;function q(s){return document.querySelector(s)}function pad(n){return n<10?'0'+n:String(n)}function yen(n){n=Number(n);return isFinite(n)?n.toLocaleString()+'円':'--'}function pct(n){n=Number(n);return isFinite(n)?n.toFixed(1)+'%':'--'}function jstDate(){return new Date(Date.now()+32400000).toISOString().slice(0,10)}function hmMin(v){var m=String(v||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*$/);return m?Number(m[1])*60+Number(m[2]):null}function hmText(v){var m=String(v||'').match(/(\d{1,2}:\d{2})(?::\d{2})?\s*$/);return m?m[1]:'--'}function nowMin(){var d=new Date(Date.now()+32400000);return d.getUTCHours()*60+d.getUTCMinutes()}function left(r){var m=hmMin(r.close_time||r.deadline);return m===null?null:m-nowMin()}function countText(r){var m=left(r);if(m===null||r.finished||r.noevent)return'';if(m<0)return'締切';if(m===0)return'あと1分未満';return'あと'+m+'分'}function state(r){var d=String(r.decision||'SKIP').toUpperCase(),s=Number(r.stake_total_yen||0);if(d==='ENTER'&&s>0)return'enter';if(d==='FINALIZING')return'finalizing';if(d==='WATCH')return'watch';return'skip'}function stateText(s){if(s==='enter')return'✅ 予想完了';if(s==='finalizing')return'🔄 最終判定中';if(s==='watch')return'👀 様子見';return'⏸ 見送り'}function defaults(){var a=[],i;for(i=0;i<24;i++)a.push({venue_name:VENUES[i],venue_code:pad(i+1),decision:'SKIP',stake_total_yen:0,loading:true});return a}function fetchJson(url,timeout){return new Promise(function(resolve,reject){var done=false,t=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'))}},timeout||6000);fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){if(!done){done=true;clearTimeout(t);resolve(j)}}).catch(function(e){if(!done){done=true;clearTimeout(t);reject(e)}})})}function normalizePrediction(p){if(p&&p.data&&typeof p.data==='object')p=p.data;if(p&&p.result&&typeof p.result==='object')p=p.result;return p||{}}function render(){var html='',i,r,s,m,urgent,label;for(i=0;i<24;i++){r=null;for(var j=0;j<races.length;j++){if(races[j].venue_name===VENUES[i]){r=races[j];break}}if(!r)r={venue_name:VENUES[i],decision:'SKIP',noevent:true,stake_total_yen:0};s=state(r);m=left(r);urgent=m!==null&&m>=0&&m<=10&&!r.finished&&!r.noevent;if(r.loading)label='取得中';else if(r.noevent)label='本日非開催';else if(r.finished)label='本日終了';else label=stateText(s);html+='<button class="venue '+s+(urgent?' urgent':'')+'" data-v="'+VENUES[i]+'"><b>'+VENUES[i]+'</b><small>'+(r.race_no?r.race_no+'R':'')+'</small>'+(!r.loading&&!r.finished&&!r.noevent?'<strong class="countdown">'+countText(r)+'</strong>':'')+'<span class="state">'+label+'</span></button>'}q('#venues').innerHTML=html;var bs=document.querySelectorAll('.venue'),k;for(k=0;k<bs.length;k++)bs[k].onclick=function(){openVenue(this.getAttribute('data-v'))}}function parseSchedule(j){var stadiums=j&&j.programs&&j.programs.stadiums;if(!stadiums)throw new Error('schedule');var date=jstDate(),ymd=date.replace(/-/g,''),now=nowMin(),out=[],v,st,rs,rn,r,dm,cand,key;for(v=1;v<=24;v++){st=stadiums[String(v)]||stadiums[pad(v)];if(!st||!st.races){out.push({venue_name:VENUES[v-1],venue_code:pad(v),decision:'SKIP',stake_total_yen:0,noevent:true});continue}rs=[];for(key in st.races){if(!Object.prototype.hasOwnProperty.call(st.races,key))continue;r=st.races[key];rn=Number(r.race_number||key);dm=hmMin(r.closed_at);if(rn>=1&&rn<=12&&dm!==null)rs.push({rn:rn,r:r,dm:dm})}rs.sort(function(a,b){return a.rn-b.rn});cand=null;for(var x=0;x<rs.length;x++){if(rs[x].dm>=now-1){cand=rs[x];break}}if(!cand){out.push({venue_name:VENUES[v-1],venue_code:pad(v),decision:'SKIP',stake_total_yen:0,finished:true});continue}out.push({venue_name:VENUES[v-1],venue_code:pad(v),race_no:cand.rn,race_code:ymd+pad(v)+pad(cand.rn),deadline:hmText(cand.r.closed_at),close_time:cand.r.closed_at,decision:'WATCH',stake_total_yen:0,locked:false})}return out}function applyPrediction(r,raw,lock){var p=normalizePrediction(raw),picks=Array.isArray(p.production_picks)?p.production_picks:[],stake=Number(p.stake_total_yen||p.stake||0),score=null;if(!stake&&picks.length){for(var i=0;i<picks.length;i++)stake+=Number(picks[i].stake_yen||picks[i].amount||picks[i].stake||0)}if(p.summary_scores&&p.summary_scores.value_score!==undefined)score=Number(p.summary_scores.value_score);else if(p.value_score!==undefined)score=Number(p.value_score);else if(p.score!==undefined)score=Number(p.score);var enter=!!p.purchase_allowed&&picks.length>0&&stake>0&&score!==null&&isFinite(score)&&score>=70;r.prediction=p;r.score=score!==null&&isFinite(score)?score:'--';r.decision=enter?'ENTER':(lock?'SKIP':'WATCH');r.stake_total_yen=enter?Math.min(5000,stake):0;if(lock)r.locked=true}function predictOne(r,final){if(!r||!r.race_code||r.finished||r.noevent||r.locked)return Promise.resolve();var m=left(r),url='/api/live/predict?race_code='+encodeURIComponent(r.race_code);if(final){r.decision='FINALIZING';render();url+='&final=1&minutes_to_close='+encodeURIComponent(String(Math.max(0,m===null?8:m)))+'&_t='+Date.now()}return fetchJson(url,6500).then(function(p){applyPrediction(r,p,final)}).catch(function(){if(final){r.decision='SKIP';r.stake_total_yen=0;r.locked=true}})}function hydrate(finalOnly){if(busy)return Promise.resolve();busy=true;var jobs=[],i,r,m;for(i=0;i<races.length;i++){r=races[i];m=left(r);if(!r.race_code||r.finished||r.noevent||r.locked)continue;if(finalOnly){if(m!==null&&m>=0&&m<=8)jobs.push(predictOne(r,true))}else{if(m===null||m>8)jobs.push(predictOne(r,false))}}return Promise.all(jobs.map(function(p){return p.catch(function(){})})).then(function(){busy=false;render()}).catch(function(){busy=false;render()})}function loadSchedule(){q('#health').textContent='開催確認中';q('#statusLog').textContent='24場表示済み／開催データ取得中';return fetchJson('/api/official?date='+jstDate()+'&_t='+Date.now(),7000).then(function(j){races=parseSchedule(j);q('#health').textContent='SYSTEM ONLINE';q('#health').className='pill ok';q('#statusLog').textContent='開催データ取得済み／8分前までに最終確定';render();return hydrate(false).then(function(){return hydrate(true)})}).catch(function(){races=defaults();for(var i=0;i<races.length;i++){races[i].loading=false;races[i].noevent=true}q('#health').textContent='開催データ再取得';q('#health').className='pill ng';q('#statusLog').textContent='24場表示継続中／開催データ再取得待ち';render()})}function deepFind(o,keys,depth){if(!o||typeof o!=='object'||depth>5)return undefined;for(var i=0;i<keys.length;i++){if(o[keys[i]]!==undefined&&o[keys[i]]!==null)return o[keys[i]]}for(var k in o){if(Object.prototype.hasOwnProperty.call(o,k)&&o[k]&&typeof o[k]==='object'){var z=deepFind(o[k],keys,depth+1);if(z!==undefined)return z}}return undefined}function loadStats(){fetchJson('/api/performance?_t='+Date.now(),6000).then(function(p){var hit=deepFind(p,['hit_rate','hitRate','accuracy'],0),roi=deepFind(p,['roi','recovery_rate','recoveryRate'],0),profit=deepFind(p,['profit_yen','profit','balance'],0);q('#hitRate').textContent=pct(hit);q('#roi').textContent=pct(roi);q('#profit').textContent=profit!==undefined?yen(profit):'--'}).catch(function(){})}function findVenue(name){for(var i=0;i<races.length;i++)if(races[i].venue_name===name)return races[i];return null}function drawDetail(r){var s=state(r),p=r.prediction||{},picks=s==='enter'&&Array.isArray(p.production_picks)?p.production_picks:[],m=left(r),html='<div class="hero"><div><h2>'+r.venue_name+'</h2><span class="decision '+s+'">'+(r.finished?'本日終了':r.noevent?'本日非開催':stateText(s))+'</span><strong class="detailCountdown '+(m!==null&&m<=10?'urgentText':'')+'">'+countText(r)+'</strong></div><div class="score"><b>'+(r.score===undefined?'--':r.score)+'</b></div></div><div class="meta"><div><span>レース</span><b>'+(r.race_no?r.race_no+'R':'--')+'</b></div><div><span>締切</span><b>'+(r.deadline||'--')+'</b></div><div><span>投資</span><b>'+yen(r.stake_total_yen||0)+'</b></div></div><div class="picks">';if(picks.length){for(var i=0;i<Math.min(6,picks.length);i++){var x=picks[i];html+='<div class="pick"><b>'+(x.ticket||x.combination||x.bet||'--')+'</b><strong>'+yen(x.stake_yen||x.amount||x.stake||0)+'</strong></div>'}}else html+='<div class="log">'+(r.locked?'8分前最終判定：見送り':'予想確定後に表示')+'</div>';html+='</div>';q('#detailBody').innerHTML=html}function openVenue(name){var r=findVenue(name);if(!r)return;var m=left(r);var p=Promise.resolve();if(!r.locked&&m!==null&&m>=0&&m<=8)p=predictOne(r,true);p.then(function(){drawDetail(r);q('#listCard').classList.add('hidden');q('#detail').classList.remove('hidden');window.scrollTo(0,0)})}function tick(){render();if(!busy)hydrate(true)}function boot(){races=defaults();render();q('#health').textContent='画面稼働中';q('#statusLog').textContent='24場表示済み／開催データ取得中';loadSchedule();loadStats()}window.onerror=function(){q('#health').textContent='画面エラー';q('#health').className='pill ng';q('#statusLog').textContent='24場表示は継続／画面処理を再試行してください'};q('#reload').onclick=function(){races=defaults();render();loadSchedule();loadStats()};q('#back').onclick=function(){q('#detail').classList.add('hidden');q('#listCard').classList.remove('hidden')};boot();setInterval(tick,30000);setInterval(loadSchedule,120000);setInterval(loadStats,300000)})();</script></body></html>
