<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020914">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ONE BOAT</title>
<link rel="stylesheet" href="/styles.css?v=20260914-1914">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logoWrap">
    <div class="logoMark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><path d="M8 39c10 0 15-7 22-19 5 12 12 17 26 19-7 10-17 15-27 15S14 49 8 39Z" stroke="#47d7ff" stroke-width="5" stroke-linejoin="round"/><path d="M12 31c8 0 12-4 17-11" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <div class="brand">ONE BOAT<span class="brandSub">DATA × STRATEGY × VICTORY</span></div>
  </div>
  <div id="health" class="health">起動中</div>
</header>

<main>
<section id="screen-home" class="screen active">
  <div class="card hero">
    <div class="heroCopy">
      <div class="eyebrow">ONE BOAT V5.1</div>
      <h1>データで導く、<br>勝ち筋を。</h1>
      <p>直近レースだけを判定。買わないレースも見送りとして公開。</p>
    </div>
    <svg class="heroBoat" viewBox="0 0 240 150" fill="none" aria-hidden="true"><path d="M25 97c43 0 66-17 86-62 19 30 49 45 105 52-18 34-53 51-94 51-47 0-77-14-97-41Z" fill="#e8f9ff"/><path d="M67 92 113 38l31 11-17 45" fill="#35c9ff" opacity=".85"/><path d="M18 113c43 8 81 10 120 4 32-5 58-14 82-29" stroke="#37d7ff" stroke-width="7" stroke-linecap="round"/><path d="M58 121c34 10 76 11 120 0" stroke="#0f79c6" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="dateStrip"><span id="todayText">--</span><span id="openCount" class="statusChip">開催確認中</span></div>
  </div>

  <div class="sectionTitle"><h2>次の注目レース</h2><button class="linkBtn" data-nav="venues">場一覧</button></div>
  <div id="focusCard" class="card focusCard"><div class="empty">開催データを取得しています</div></div>

  <div class="sectionTitle"><h2>本日の成績</h2><button class="linkBtn" data-nav="performance">収支を見る</button></div>
  <div class="card">
    <div class="statsGrid">
      <div class="stat"><span>投資額</span><b id="homeInvest">--</b></div>
      <div class="stat"><span>払戻額</span><b id="homeReturn">--</b></div>
      <div class="stat"><span>収支</span><b id="homeProfit">--</b></div>
      <div class="stat"><span>回収率</span><b id="homeRoi">--</b></div>
    </div>
  </div>

  <div class="sectionTitle"><h2>本日の開催</h2><span id="homeVenueHint" class="mini muted">--</span></div>
  <div id="homeVenues" class="venues"></div>
</section>

<section id="screen-venues" class="screen">
  <div class="pageHead"><div><div class="eyebrow">VENUES</div><h1>場を選ぶ</h1><div class="mini muted">24場から開催状況を確認</div></div><button id="reload" class="ghostBtn">更新</button></div>
  <div class="venueFilters"><button class="active" data-filter="open">開催中</button><button data-filter="off">非開催</button><button data-filter="all">すべて24</button></div>
  <div id="venues" class="venues"></div>
</section>

<section id="screen-races" class="screen">
  <div class="pageHead"><div><button id="backToVenues" class="backBtn">‹ 場選択</button><div class="eyebrow" style="margin-top:8px">RACE LIST</div><h1 id="raceVenueTitle">--</h1></div></div>
  <div id="raceVenueHeader" class="card raceHeader"></div>
  <div class="sectionTitle"><h2>レース一覧</h2><span class="mini muted">直近レースのみ判定</span></div>
  <div id="raceList" class="card raceList"></div>
</section>

<section id="screen-detail" class="screen">
  <div class="pageHead"><div><button id="backToRaces" class="backBtn">‹ レース一覧</button></div></div>
  <div id="detailHead" class="card detailHead"></div>
  <div class="tabs" id="detailTabs"><button class="active" data-tab="prediction">予想</button><button data-tab="live">直前情報</button><button data-tab="analysis">データ分析</button></div>
  <div id="detailContent"></div>
</section>

<section id="screen-result" class="screen">
  <div class="pageHead"><div><button id="backResult" class="backBtn">‹ レース一覧</button><div class="eyebrow" style="margin-top:8px">RESULT</div><h1 id="resultTitle">結果</h1></div></div>
  <div id="resultContent"></div>
</section>

<section id="screen-performance" class="screen">
  <div class="pageHead"><div><div class="eyebrow">PERFORMANCE</div><h1>収支記録</h1><div class="mini muted">的中も不的中も集計</div></div></div>
  <div class="subTabs" id="perfTabs"><button class="active" data-perf="daily">日別</button><button data-perf="venue">場別</button><button data-perf="theory">理論別</button><button data-perf="period">期間別</button></div>
  <div id="performanceContent"></div>
</section>
</main>

<nav class="bottomNav" aria-label="メインナビ">
  <button class="active" data-nav="home"><b>⌂</b>ホーム</button>
  <button data-nav="venues"><b>▦</b>場選択</button>
  <button id="navRace" data-nav="races"><b>◎</b>レース</button>
  <button data-nav="performance"><b>▥</b>収支</button>
</nav>
</div>

<script>
(function(){'use strict';
var VENUES=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];
var venueData=[],performanceData=null,selectedVenue=null,selectedRace=null,currentView='home',venueFilter='open',detailTab='prediction',perfTab='daily',loadingPrediction={};
function q(s){return document.querySelector(s)}
function qa(s){return document.querySelectorAll(s)}
function pad(n){return n<10?'0'+n:String(n)}
function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=Number(v);return isFinite(n)?n:null}
function yen(v){var n=num(v);return n===null?'--':n.toLocaleString()+'円'}
function pct(v){var n=num(v);return n===null?'--':n.toFixed(1)+'%'}
function jstDate(){return new Date(Date.now()+32400000).toISOString().slice(0,10)}
function todayLabel(){var a=jstDate().split('-');return Number(a[1])+'/'+Number(a[2])+' '+['日','月','火','水','木','金','土'][new Date(jstDate()+'T00:00:00+09:00').getDay()]+'曜日'}
function hmMin(v){var m=String(v||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*$/);return m?Number(m[1])*60+Number(m[2]):null}
function hmText(v){var m=String(v||'').match(/(\d{1,2}:\d{2})(?::\d{2})?\s*$/);return m?m[1]:'--'}
function nowMin(){var d=new Date(Date.now()+32400000);return d.getUTCHours()*60+d.getUTCMinutes()}
function minutesLeft(r){var m=hmMin(r&&r.close_time);return m===null?null:m-nowMin()}
function countText(r){var m=minutesLeft(r);if(m===null)return'';if(m<0)return'締切済み';if(m===0)return'締切まで1分未満';return'締切まであと'+m+'分'}
function fetchJson(url,timeout){return new Promise(function(resolve,reject){var done=false,t=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'))}},timeout||6500);fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){if(!done){done=true;clearTimeout(t);resolve(j)}}).catch(function(e){if(!done){done=true;clearTimeout(t);reject(e)}})})}
function normalize(o){if(o&&o.data&&typeof o.data==='object'&&!Array.isArray(o.data))o=o.data;if(o&&o.result&&typeof o.result==='object'&&!Array.isArray(o.result))o=o.result;return o||{}}
function deepFind(o,keys,depth){if(o===null||o===undefined||typeof o!=='object'||depth>7)return undefined;for(var i=0;i<keys.length;i++)if(o[keys[i]]!==undefined&&o[keys[i]]!==null)return o[keys[i]];for(var k in o)if(Object.prototype.hasOwnProperty.call(o,k)&&o[k]&&typeof o[k]==='object'){var z=deepFind(o[k],keys,depth+1);if(z!==undefined)return z}return undefined}
function findArray(o,keys,depth){if(o===null||o===undefined||typeof o!=='object'||depth>7)return null;for(var i=0;i<keys.length;i++)if(Array.isArray(o[keys[i]]))return o[keys[i]];for(var k in o)if(Object.prototype.hasOwnProperty.call(o,k)&&o[k]&&typeof o[k]==='object'){var z=findArray(o[k],keys,depth+1);if(z)return z}return null}
function weatherText(o){var w=deepFind(o,['weather','weather_name','weather_condition','tenki'],0);return typeof w==='string'&&w?w:'--'}
function windText(o){var s=deepFind(o,['wind_speed','wind_speed_mps'],0),d=deepFind(o,['wind_direction','wind_dir'],0);if(s===undefined&&d===undefined)return'--';return (d||'')+(s!==undefined?' '+s+'m':'')}
function waveText(o){var v=deepFind(o,['wave_height','wave','wave_height_cm'],0);return v===undefined?'--':String(v)+(String(v).indexOf('cm')>=0?'':'cm')}
function stateOf(r){var p=r&&r.prediction?normalize(r.prediction):{},d=String(p.decision||r.decision||'').toUpperCase(),stake=num(p.stake_total_yen!==undefined?p.stake_total_yen:r.stake_total_yen);if(d==='ENTER'&&stake!==null&&stake>0)return'enter';if(d==='SKIP'||r.locked)return'skip';if(r.loadingPrediction)return'loading';return'watch'}
function stateText(r){var s=stateOf(r);if(s==='enter')return'予想完了 / ENTER';if(s==='skip')return'見送り';if(s==='loading')return'予想中';return'様子見'}
function decisionChip(r){var s=stateOf(r);return '<span class="statusChip '+(s==='skip'?'gray':s==='loading'?'':'')+'">'+esc(stateText(r))+'</span>'}
function laneMarkup(ticket){var parts=String(ticket||'--').split(/[-=]/),out='';for(var i=0;i<parts.length;i++){var n=Number(parts[i]);if(n>=1&&n<=6)out+='<span class="lane'+n+'">'+n+'</span>';else if(parts[i])out+=esc(parts[i])}return out||'--'}
function show(view){currentView=view;var screens=qa('.screen');for(var i=0;i<screens.length;i++)screens[i].classList.remove('active');var el=q('#screen-'+view);if(el)el.classList.add('active');var ns=qa('.bottomNav button[data-nav]');for(i=0;i<ns.length;i++)ns[i].classList.toggle('active',ns[i].getAttribute('data-nav')===view);window.scrollTo(0,0);if(view==='home')renderHome();if(view==='venues')renderVenues();if(view==='races')renderRaces();if(view==='performance')renderPerformance()}
function parseOfficial(j){var stadiums=j&&j.programs&&j.programs.stadiums;if(!stadiums)throw new Error('schedule');var ymd=jstDate().replace(/-/g,''),now=nowMin(),out=[];for(var v=1;v<=24;v++){var st=stadiums[String(v)]||stadiums[pad(v)],venue={name:VENUES[v-1],code:pad(v),raw:st||{},noevent:!st||!st.races,races:[],target:null,weather:weatherText(st||{})};if(!venue.noevent){for(var key in st.races)if(Object.prototype.hasOwnProperty.call(st.races,key)){var rr=st.races[key],rn=Number(rr.race_number||key),dm=hmMin(rr.closed_at);if(rn<1||rn>12||dm===null)continue;venue.races.push({venue_name:venue.name,venue_code:venue.code,race_no:rn,race_code:ymd+pad(v)+pad(rn),deadline:hmText(rr.closed_at),close_time:rr.closed_at,raw:rr,phase:dm<now-1?'ended':'future',decision:'WATCH',stake_total_yen:0,locked:false})}venue.races.sort(function(a,b){return a.race_no-b.race_no});for(var x=0;x<venue.races.length;x++)if(venue.races[x].phase!=='ended'){venue.races[x].phase='current';venue.target=venue.races[x];break}if(!venue.target&&venue.races.length)venue.finished=true}out.push(venue)}return out}
function activeVenues(){return venueData.filter(function(v){return !v.noevent&&!v.finished&&v.target})}
function nearestRace(){var best=null,bestV=null;for(var i=0;i<venueData.length;i++){var v=venueData[i],r=v.target,m=minutesLeft(r);if(!r||m===null||m<0)continue;if(!best||m<minutesLeft(best)){best=r;bestV=v}}return best?{venue:bestV,race:best}:null}
function renderHome(){q('#todayText').textContent=todayLabel();var opens=activeVenues();q('#openCount').textContent='開催中 '+opens.length+'場';q('#homeVenueHint').textContent='開催中 '+opens.length+'場';var n=nearestRace(),fc=q('#focusCard');if(!n){fc.innerHTML='<div class="empty">現在、直近対象レースはありません</div>'}else{var r=n.race,v=n.venue,score=r.prediction?deepFind(normalize(r.prediction),['confidence_score','confidence'],0):undefined;fc.innerHTML='<div class="focusTop"><div><div class="mini muted">次の注目レース</div><div class="focusVenue">'+esc(v.name)+' <span class="focusRace">'+r.race_no+'R</span></div><div class="countdown '+(minutesLeft(r)!==null&&minutesLeft(r)<=10?'urgent':'')+'">'+esc(countText(r))+'</div></div>'+decisionChip(r)+'</div><div class="infoGrid" style="margin:12px 0"><div class="infoBox"><span>締切</span><b>'+esc(r.deadline)+'</b></div><div class="infoBox"><span>信頼度</span><b>'+(score===undefined?'判定後':esc(score)+'%')+'</b></div></div><button class="primaryBtn" id="focusOpen">予想を見る</button>';q('#focusOpen').onclick=function(){selectVenue(v.name,true)}}var html='';for(var i=0;i<Math.min(4,opens.length);i++)html+=venueCard(opens[i]);q('#homeVenues').innerHTML=html||'<div class="empty" style="grid-column:1/-1">開催データ待ち</div>';bindVenueButtons('#homeVenues')}
function venueCard(v){var r=v.target,m=r?minutesLeft(r):null,off=v.noevent||v.finished;return '<button class="venue '+(off?'off':'')+'" data-venue="'+esc(v.name)+'"><span class="statusChip '+(off?'gray':'')+'">'+(v.noevent?'非開催':v.finished?'本日終了':'開催中')+'</span><b>'+esc(v.name)+'</b><div class="venueMeta"><div><span class="mini muted">次</span><div class="next">'+(r?r.race_no+'R':'--')+'</div><div class="countdown '+(m!==null&&m<=10?'urgent':'')+'">'+(r?esc(countText(r)):'')+'</div></div><div class="weather">天候 '+esc(v.weather)+'</div></div></button>'}
function renderVenues(){var html='';for(var i=0;i<venueData.length;i++){var v=venueData[i],isOff=v.noevent||v.finished;if(venueFilter==='open'&&isOff)continue;if(venueFilter==='off'&&!isOff)continue;html+=venueCard(v)}q('#venues').innerHTML=html||'<div class="empty" style="grid-column:1/-1">該当する場はありません</div>';bindVenueButtons('#venues')}
function bindVenueButtons(root){var bs=q(root).querySelectorAll('[data-venue]');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){selectVenue(this.getAttribute('data-venue'),false)}}
function venueByName(name){for(var i=0;i<venueData.length;i++)if(venueData[i].name===name)return venueData[i];return null}
function selectVenue(name,openCurrent){selectedVenue=venueByName(name);if(!selectedVenue)return;show('races');if(selectedVenue.target)ensurePrediction(selectedVenue.target).then(function(){renderRaces();renderHome();if(openCurrent)openRace(selectedVenue.target)});else renderRaces()}
function renderRaces(){if(!selectedVenue){q('#raceVenueTitle').textContent='場未選択';q('#raceList').innerHTML='<div class="empty">場選択から場を選んでください</div>';return}q('#raceVenueTitle').textContent=selectedVenue.name;q('#raceVenueHeader').innerHTML='<div class="raceHeaderTop"><div><h2>'+esc(selectedVenue.name)+'</h2><div class="mini muted">'+todayLabel()+'</div></div><span class="statusChip '+(selectedVenue.noevent||selectedVenue.finished?'gray':'')+'">'+(selectedVenue.noevent?'非開催':selectedVenue.finished?'本日終了':'開催中')+'</span></div><div class="weatherRow"><span>天候 '+esc(selectedVenue.weather)+'</span><span>風 '+esc(windText(selectedVenue.raw))+'</span><span>波 '+esc(waveText(selectedVenue.raw))+'</span></div>';if(selectedVenue.noevent){q('#raceList').innerHTML='<div class="empty">本日は非開催です</div>';return}var html='';for(var i=0;i<selectedVenue.races.length;i++){var r=selectedVenue.races[i],st='',score='';if(r.phase==='ended')st='終了';else if(r.phase==='future')st='未判定';else{st=stateText(r);var p=normalize(r.prediction||{}),cs=deepFind(p,['confidence_score','confidence'],0);score=cs!==undefined?esc(cs)+'%':''}html+='<div class="raceRow '+(r.phase==='current'?'current':r.phase==='future'?'future':'')+'" data-race="'+r.race_no+'"><div class="raceNo">'+r.race_no+'R</div><div class="raceTime">'+esc(r.deadline)+'</div><div class="raceState">'+esc(st)+'</div><div class="raceScore">'+score+'</div></div>'}q('#raceList').innerHTML=html||'<div class="empty">レース情報がありません</div>';var rows=q('#raceList').querySelectorAll('[data-race]');for(i=0;i<rows.length;i++)rows[i].onclick=function(){var rn=Number(this.getAttribute('data-race')),r=findRace(selectedVenue,rn);if(!r)return;if(r.phase==='future')return;if(r.phase==='ended')openResult(r);else openRace(r)}}
function findRace(v,rn){if(!v)return null;for(var i=0;i<v.races.length;i++)if(v.races[i].race_no===rn)return v.races[i];return null}
function ensurePrediction(r){if(!r||r.phase!=='current')return Promise.resolve();if(r.prediction&&!shouldFinal(r))return Promise.resolve(r.prediction);if(loadingPrediction[r.race_code])return loadingPrediction[r.race_code];r.loadingPrediction=true;renderCurrentSafe();var final=shouldFinal(r),url='/api/live/predict?race_code='+encodeURIComponent(r.race_code);if(final)url+='&final=1&minutes_to_close='+encodeURIComponent(String(Math.max(0,minutesLeft(r)||0)))+'&_t='+Date.now();loadingPrediction[r.race_code]=fetchJson(url,7000).then(function(raw){r.prediction=normalize(raw);r.loadingPrediction=false;var p=r.prediction,d=String(p.decision||'').toUpperCase(),stake=num(p.stake_total_yen);r.decision=(d==='ENTER'&&stake!==null&&stake>0)?'ENTER':d==='SKIP'?'SKIP':'WATCH';r.stake_total_yen=r.decision==='ENTER'?Math.min(5000,stake||0):0;if(final){r.locked=true;if(r.decision!=='ENTER'){r.decision='SKIP';r.stake_total_yen=0}}delete loadingPrediction[r.race_code];renderCurrentSafe();return r.prediction}).catch(function(){r.loadingPrediction=false;if(final){r.locked=true;r.decision='SKIP';r.stake_total_yen=0}delete loadingPrediction[r.race_code];renderCurrentSafe();return null});return loadingPrediction[r.race_code]}
function shouldFinal(r){var m=minutesLeft(r);return m!==null&&m>=0&&m<=8}
function renderCurrentSafe(){if(currentView==='home')renderHome();if(currentView==='venues')renderVenues();if(currentView==='races')renderRaces();if(currentView==='detail')renderDetail()}
function openRace(r){if(!r||r.phase!=='current')return;selectedRace=r;ensurePrediction(r).then(function(){detailTab='prediction';show('detail');renderDetail()})}
function renderDetail(){if(!selectedRace||!selectedVenue){q('#detailContent').innerHTML='<div class="card empty">レースを選択してください</div>';return}var r=selectedRace,p=normalize(r.prediction||{}),cs=deepFind(p,['confidence_score','confidence'],0),vs=deepFind(p,['value_score','score'],0),main=deepFind(p,['main_boat','main_lane','axis_boat','anchor_boat','top_boat'],0),theory=deepFind(p,['selected_theory','strategy','current_theory','theory'],0),m=minutesLeft(r);q('#detailHead').innerHTML='<div class="detailTitleRow"><div><h2>'+esc(selectedVenue.name)+' '+r.race_no+'R</h2><div class="countdown '+(m!==null&&m<=10?'urgent':'')+'">'+esc(countText(r))+'</div></div>'+decisionChip(r)+'</div><div class="decisionBig"><div class="mainBoat"><div class="laneBox">'+(main!==undefined?esc(main):'–')+'</div><div><div class="mini muted">本命艇</div><b>'+(main!==undefined?esc(main)+'号艇':'判定データ待ち')+'</b></div></div><div class="confidence">信頼度<b>'+(cs!==undefined?esc(cs)+'%':'--')+'</b></div></div>';var tabs=q('#detailTabs').querySelectorAll('button');for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('active',tabs[i].getAttribute('data-tab')===detailTab);if(detailTab==='prediction')renderPredictionTab(p,vs,theory);else if(detailTab==='live')renderLiveTab(p);else renderAnalysisTab(p)}
function renderPredictionTab(p,vs,theory){var reason=deepFind(p,['ai_comment','comment','local_rule_reason','decision_reason','reason'],0),stake=deepFind(p,['stake_total_yen','stake'],0),er=deepFind(p,['expected_roi','expected_recovery_rate','expected_return_rate'],0),picks=Array.isArray(p.production_picks)?p.production_picks:[],groups=groupPicks(picks,p.category),html='<div class="card detailBody"><div class="infoGrid"><div class="infoBox"><span>買う価値</span><b>'+(vs!==undefined?esc(vs)+'/100':'--')+'</b></div><div class="infoBox"><span>現在採用理論</span><b>'+esc(theory||'--')+'</b></div><div class="infoBox"><span>想定投資額</span><b>'+yen(stake)+'</b></div><div class="infoBox"><span>期待回収率</span><b>'+(er!==undefined?pct(er):'--')+'</b></div></div><div class="aiComment"><b style="color:#62d8ff">AIコメント</b><br>'+esc(reason||'判定理由データを取得中')+'</div></div><div class="sectionTitle"><h2>推奨買い目</h2><span class="mini muted">タップで開閉</span></div>';html+=betAccordion('本命',groups.main,4,true);html+=betAccordion('中穴',groups.mid,10,false);html+=betAccordion('穴',groups.hole,20,false);if(!picks.length)html+='<div class="card empty">ENTER時のみ本番買い目を表示します。様子見・見送りでは買い目を表示しません。</div>';q('#detailContent').innerHTML=html;bindAccordions()}
function pickOdds(x){return num(x&&((x.odds!==undefined?x.odds:x.expected_odds!==undefined?x.expected_odds:x.current_odds)))}
function groupPicks(picks,raceCategory){var g={main:[],mid:[],hole:[]};for(var i=0;i<picks.length;i++){var x=picks[i],o=pickOdds(x);if(o!==null){if(o<20)g.main.push(x);else if(o<60)g.mid.push(x);else g.hole.push(x)}else if(raceCategory==='中穴')g.mid.push(x);else if(raceCategory==='狙い目'||raceCategory==='高配当'||raceCategory==='超高配当')g.hole.push(x);else g.main.push(x)}g.main=g.main.slice(0,4);g.mid=g.mid.slice(0,10);g.hole=g.hole.slice(0,20);return g}
function betAccordion(label,arr,max,open){return '<div class="accordion '+(open?'open':'')+'"><button class="accordionBtn"><span>'+esc(label)+' '+arr.length+'点</span><span>'+ (open?'−':'+') +'</span></button><div class="accordionPanel">'+(arr.length?arr.map(function(x){var t=x.ticket||x.combination||x.bet||'--',o=pickOdds(x),s=x.stake_yen!==undefined?x.stake_yen:x.amount!==undefined?x.amount:x.stake;return '<div class="betRow"><div class="betTicket">'+laneMarkup(t)+'</div><div class="betOdds">'+(o===null?'--':o.toFixed(1))+'</div><div class="betStake">'+yen(s)+'</div></div>'}).join(''):'<div class="empty">該当する買い目なし</div>')+'</div></div>'}
function bindAccordions(){var as=qa('.accordionBtn');for(var i=0;i<as.length;i++)as[i].onclick=function(){var a=this.parentNode;a.classList.toggle('open');this.lastElementChild.textContent=a.classList.contains('open')?'−':'+'}}
function loadDetailData(r){if(r.detail)return Promise.resolve(r.detail);if(r.detailLoading)return r.detailLoading;r.detailLoading=fetchJson('/api/detail?race_code='+encodeURIComponent(r.race_code)+'&_t='+Date.now(),7000).then(function(d){r.detail=normalize(d);r.detailLoading=null;return r.detail}).catch(function(){r.detail={};r.detailLoading=null;return r.detail});return r.detailLoading}
function renderLiveTab(p){q('#detailContent').innerHTML='<div class="card empty">直前データを取得しています</div>';loadDetailData(selectedRace).then(function(d){if(detailTab!=='live')return;var src=mergeObjects(d,p),items=[['展示タイム',['exhibition_time','tenji_time']],['ST',['st','start_timing','start_display']],['展示気配',['exhibition_mood','exhibition_score','display_condition']],['進入予想',['entry_prediction','course_prediction']],['直前オッズ',['odds','current_odds','expected_odds']],['風速',['wind_speed','wind_speed_mps']],['風向',['wind_direction','wind_dir']],['波高',['wave_height','wave_height_cm']],['水温',['water_temperature','water_temp']],['天候',['weather','weather_name']]],html='<div class="card detailBody"><div class="infoGrid">';for(var i=0;i<items.length;i++){var v=deepFind(src,items[i][1],0);html+='<div class="infoBox"><span>'+items[i][0]+'</span><b>'+esc(v===undefined?'--':v)+'</b></div>'}html+='</div></div><div class="sectionTitle"><h2>直前で変化したポイント</h2><span class="mini muted">10分前再計算 / 8分前確定</span></div>';var aux=findArray(p,['auxiliary_reasons'],0)||[];if(aux.length){html+='<div class="card detailBody dataCards">';for(i=0;i<aux.length;i++)html+='<div class="dataCard"><h3>'+esc(aux[i].label||aux[i].key||'補助条件')+'</h3><div class="kv"><span>スコア</span><b>'+esc(aux[i].score===undefined?'--':aux[i].score)+'</b></div><div class="kv"><span>補正</span><b>'+esc(aux[i].contribution===undefined?'--':aux[i].contribution)+'</b></div></div>';html+='</div>'}else html+='<div class="card empty">直前変化データは取得できた項目だけ表示します</div>';q('#detailContent').innerHTML=html})}
function mergeObjects(a,b){var o={},k;for(k in a)if(Object.prototype.hasOwnProperty.call(a,k))o[k]=a[k];for(k in b)if(Object.prototype.hasOwnProperty.call(b,k))o[k]=b[k];return o}
function renderAnalysisTab(p){q('#detailContent').innerHTML='<div class="card empty">分析データを取得しています</div>';loadDetailData(selectedRace).then(function(d){if(detailTab!=='analysis')return;var src=mergeObjects(d,p),breakdown=findArray(p,['confidence_breakdown'],0)||[],html='<div class="sectionTitle"><h2>予想スコア内訳</h2><span class="mini muted">自信度100点</span></div><div class="card detailBody"><div class="metricList">';if(breakdown.length){for(var i=0;i<breakdown.length;i++){var b=breakdown[i],sc=num(b.score);html+='<div class="metricRow"><span>'+esc(b.label||b.axis)+'</span><div class="metricBar"><i style="width:'+(sc===null?0:Math.max(0,Math.min(100,sc)))+'%"></i></div><b>'+(sc===null?'--':sc)+'</b></div>'}}else html+='<div class="empty">スコア内訳データ待ち</div>';html+='</div></div><div class="sectionTitle"><h2>データ分析</h2><span class="mini muted">取得できた値のみ</span></div><div class="dataCards">';var cards=[['選手・コース',['player_course_score','course_fit_score','player_strength']],['モーター',['motor_score','motor_foot_score','motor_gain']],['イン逃げ率',['in_win_rate','boat1_win_rate','in_trust']],['場クセ',['venue_bias','venue_score']],['水面傾向',['water_change','water_score']],['風',['wind_match_score','wind14d_in_win_rate','wind_speed']],['季節',['season_score','season_bias']],['当日流れ',['day_flow_score','day_flow_theory']],['オッズ歪み',['odds_distortion','value_edge_score']],['採用理論',['selected_theory','strategy','current_theory']]];for(i=0;i<cards.length;i++){var vv=deepFind(src,cards[i][1],0);html+='<div class="dataCard"><h3>'+cards[i][0]+'</h3><div class="kv"><span>現在値</span><b>'+esc(vv===undefined?'--':vv)+'</b></div></div>'}html+='</div>';q('#detailContent').innerHTML=html})}
function openResult(r){selectedRace=r;show('result');q('#resultTitle').textContent=selectedVenue.name+' '+r.race_no+'R';q('#resultContent').innerHTML='<div class="card empty">結果データを取得しています</div>';loadDetailData(r).then(function(d){renderResult(d,r)})}
function renderResult(d,r){var order=deepFind(d,['finish_order','arrival_order','order','result_order'],0),trifecta=deepFind(d,['trifecta','sanrentan','winning_ticket'],0),payout=deepFind(d,['payout','payout_yen','trifecta_payout','return_yen'],0),invest=deepFind(d,['stake_total_yen','investment','bet_yen'],0),profit=(num(payout)!==null&&num(invest)!==null)?num(payout)-num(invest):null,roi=(num(payout)!==null&&num(invest)!==null&&num(invest)>0)?num(payout)/num(invest)*100:null,theory=deepFind(d,['selected_theory','strategy','theory'],0),analysis=deepFind(d,['miss_analysis','loss_analysis','post_analysis','analysis'],0),hit=deepFind(d,['hit','is_hit','won'],0),html='<div class="card detailBody"><div class="resultBadge">'+(hit===true?'的中':hit===false?'不的中':'結果')+'</div><div class="infoGrid" style="margin-top:12px"><div class="infoBox"><span>着順</span><b>'+esc(Array.isArray(order)?order.join('-'):order===undefined?'--':order)+'</b></div><div class="infoBox"><span>3連単</span><b>'+esc(trifecta===undefined?'--':trifecta)+'</b></div><div class="infoBox"><span>投資額</span><b>'+yen(invest)+'</b></div><div class="infoBox"><span>払戻額</span><b>'+yen(payout)+'</b></div><div class="infoBox"><span>収支</span><b>'+yen(profit)+'</b></div><div class="infoBox"><span>回収率</span><b>'+pct(roi)+'</b></div></div><div class="dataCard" style="margin-top:10px"><h3>採用理論</h3><div class="kv"><span>理論</span><b>'+esc(theory===undefined?'--':theory)+'</b></div></div><div class="aiComment"><b style="color:#62d8ff">外れ分析 / 結果分析</b><br>'+esc(analysis===undefined?'取得データがある場合のみ表示します':analysis)+'</div></div>';q('#resultContent').innerHTML=html}
function renderPerformance(){var p=normalize(performanceData||{}),invest=deepFind(p,['investment','invest','bet_yen','stake_total_yen','total_bet'],0),ret=deepFind(p,['return_yen','payout','total_return','refund'],0),profit=deepFind(p,['profit_yen','profit','balance'],0),roi=deepFind(p,['roi','recovery_rate','recoveryRate'],0),hit=deepFind(p,['hit_rate','hitRate','accuracy'],0),count=deepFind(p,['hit_count','wins','hits'],0),html='<div class="card performanceSummary"><div class="infoGrid"><div class="infoBox"><span>投資額</span><b>'+yen(invest)+'</b></div><div class="infoBox"><span>払戻額</span><b>'+yen(ret)+'</b></div></div><div class="profitBig">'+yen(profit)+'</div><div class="statsGrid" style="border:1px solid #103553;border-radius:12px;overflow:hidden"><div class="stat"><span>回収率</span><b>'+pct(roi)+'</b></div><div class="stat"><span>的中率</span><b>'+pct(hit)+'</b></div><div class="stat"><span>的中数</span><b>'+esc(count===undefined?'--':count)+'</b></div><div class="stat"><span>表示</span><b>'+perfLabel(perfTab)+'</b></div></div></div>';var arr=perfArray(p,perfTab);html+=renderPerfChart(arr);html+=renderPerfTable(arr);q('#performanceContent').innerHTML=html}
function perfLabel(t){return t==='daily'?'日別':t==='venue'?'場別':t==='theory'?'理論別':'期間別'}
function perfArray(p,t){if(t==='daily')return findArray(p,['daily','by_day','day_stats','daily_stats'],0)||[];if(t==='venue')return findArray(p,['venues','by_venue','venue_stats'],0)||[];if(t==='theory')return findArray(p,['theories','by_theory','theory_stats'],0)||[];return findArray(p,['periods','by_period','period_stats'],0)||[]}
function renderPerfChart(arr){if(!arr.length)return '<div class="card empty">'+perfLabel(perfTab)+'の詳細データが取得できた場合にグラフを表示します</div>';var vals=[],sum=0;for(var i=0;i<arr.length;i++){var v=num(deepFind(arr[i],['profit','profit_yen','balance'],0));if(v===null)v=0;sum+=v;vals.push(sum)}var min=Math.min.apply(Math,vals),max=Math.max.apply(Math,vals);if(max===min)max=min+1;var pts=[];for(i=0;i<vals.length;i++){var x=arr.length===1?50:i/(arr.length-1)*100,y=92-(vals[i]-min)/(max-min)*80;pts.push(x.toFixed(1)+','+y.toFixed(1))}return '<div class="card cardPad"><div class="mini muted">収支推移</div><div class="chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 92H100" stroke="#153b59" stroke-width=".7"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#35d5ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div></div>'}
function renderPerfTable(arr){if(!arr.length)return'';var html='<div class="card detailBody">';for(var i=0;i<Math.min(30,arr.length);i++){var row=arr[i],name=deepFind(row,['date','venue_name','venue','theory','strategy','period','label','name'],0),roi=deepFind(row,['roi','recovery_rate'],0),profit=deepFind(row,['profit','profit_yen','balance'],0),hit=deepFind(row,['hit_rate','hitRate'],0);html+='<div class="dataCard" style="margin-bottom:7px"><h3>'+esc(name===undefined?'項目 '+(i+1):name)+'</h3><div class="kv"><span>収支</span><b>'+yen(profit)+'</b></div><div class="kv"><span>回収率</span><b>'+pct(roi)+'</b></div><div class="kv"><span>的中率</span><b>'+pct(hit)+'</b></div></div>'}html+='</div>';return html}
function loadPerformance(){return fetchJson('/api/performance?_t='+Date.now(),7000).then(function(p){performanceData=p;var x=normalize(p),invest=deepFind(x,['investment','invest','bet_yen','stake_total_yen','total_bet'],0),ret=deepFind(x,['return_yen','payout','total_return','refund'],0),profit=deepFind(x,['profit_yen','profit','balance'],0),roi=deepFind(x,['roi','recovery_rate','recoveryRate'],0);q('#homeInvest').textContent=yen(invest);q('#homeReturn').textContent=yen(ret);q('#homeProfit').textContent=yen(profit);q('#homeRoi').textContent=pct(roi);if(currentView==='performance')renderPerformance()}).catch(function(){})}
function loadSchedule(){q('#health').textContent='開催確認中';return fetchJson('/api/official?date='+jstDate()+'&_t='+Date.now(),7500).then(function(j){venueData=parseOfficial(j);q('#health').textContent='SYSTEM ONLINE';q('#health').className='health';renderCurrentSafe();var n=nearestRace();if(n)ensurePrediction(n.race)}).catch(function(){q('#health').textContent='開催データ再取得';q('#health').className='health ng';if(!venueData.length){for(var i=0;i<24;i++)venueData.push({name:VENUES[i],code:pad(i+1),noevent:true,races:[],weather:'--'})}renderCurrentSafe()})}
function tick(){for(var i=0;i<venueData.length;i++){var v=venueData[i];if(!v.races)continue;var now=nowMin(),target=null;for(var j=0;j<v.races.length;j++){var r=v.races[j],dm=hmMin(r.close_time);if(dm!==null&&dm<now-1)r.phase='ended';else if(!target){r.phase='current';target=r}else r.phase='future'}v.target=target;v.finished=!v.noevent&&!target&&v.races.length>0}if(selectedVenue)selectedVenue=venueByName(selectedVenue.name);if(selectedRace&&selectedVenue)selectedRace=findRace(selectedVenue,selectedRace.race_no)||selectedRace;if(selectedRace&&selectedRace.phase==='current'&&shouldFinal(selectedRace)&&!selectedRace.locked)ensurePrediction(selectedRace);renderCurrentSafe()}
function bind(){var nav=qa('[data-nav]');for(var i=0;i<nav.length;i++)nav[i].onclick=function(){var v=this.getAttribute('data-nav');if(v==='races'&&!selectedVenue){show('venues');return}show(v)};var fs=qa('.venueFilters button');for(i=0;i<fs.length;i++)fs[i].onclick=function(){venueFilter=this.getAttribute('data-filter');for(var j=0;j<fs.length;j++)fs[j].classList.toggle('active',fs[j]===this);renderVenues()};q('#reload').onclick=function(){loadSchedule();loadPerformance()};q('#backToVenues').onclick=function(){show('venues')};q('#backToRaces').onclick=function(){show('races')};q('#backResult').onclick=function(){show('races')};var dt=q('#detailTabs').querySelectorAll('button');for(i=0;i<dt.length;i++)dt[i].onclick=function(){detailTab=this.getAttribute('data-tab');renderDetail()};var pt=q('#perfTabs').querySelectorAll('button');for(i=0;i<pt.length;i++)pt[i].onclick=function(){perfTab=this.getAttribute('data-perf');for(var j=0;j<pt.length;j++)pt[j].classList.toggle('active',pt[j]===this);renderPerformance()}}
function boot(){bind();q('#todayText').textContent=todayLabel();renderHome();loadSchedule();loadPerformance();setInterval(tick,30000);setInterval(loadSchedule,120000);setInterval(loadPerformance,300000)}
window.onerror=function(){q('#health').textContent='画面エラー';q('#health').className='health ng'};
boot();
})();
